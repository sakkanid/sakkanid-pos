    '<div><div class="card-title" style="font-size:13px">💳 แยกตามวิธีชำระ</div><table><tr><th>วิธี</th><th>ยอดรวม</th></tr>'+Object.entries(payMethods).map(function(e){return '<tr><td>'+e[0]+'</td><td>'+thb(e[1])+'</td></tr>'}).join('')+'</table></div>'+
    '<div><div class="card-title" style="font-size:13px">📊 ค่าใช้จ่ายแยกหมวด</div>'+(Object.keys(expCat).length?'<table><tr><th>หมวด</th><th>ยอด</th></tr>'+Object.entries(expCat).map(function(e){return '<tr><td><span class="badge bg-am">'+e[0]+'</span></td><td>'+thb(e[1])+'</td></tr>'}).join('')+'</table>':'<div style="color:var(--t3);font-size:12px">ยังไม่มีค่าใช้จ่าย</div>')+'</div></div>'+
    (closedShifts.length?'<div class="card-title" style="font-size:13px;margin-top:12px">🕐 สรุปกะ ('+closedShifts.length+' กะ) · ผลต่างรวม: <span style="color:'+(totalDiff>=0?'var(--gn)':'var(--rd)')+'">'+thb(totalDiff)+'</span></div>'+
    '<table><tr><th>กะ</th><th>เปิด</th><th>ปิด</th><th>เงินสดเริ่ม</th><th>จริง</th><th>ผลต่าง</th><th>ออเดอร์</th></tr>'+
    closedShifts.slice(-10).reverse().map(function(s){return '<tr><td>'+s.id+'</td><td style="font-size:10px">'+s.openedAt+'</td><td style="font-size:10px">'+s.closedAt+'</td><td>'+thb(s.cashStart)+'</td><td>'+thb(s.cashEnd)+'</td><td style="color:'+(s.diff>=0?'var(--gn)':'var(--rd)')+'">'+thb(s.diff)+'</td><td>'+s.orderCount+'</td></tr>'}).join('')+'</table>':'');
}

// ═══ P&L กำไร/ขาดทุน รายเดือน ═══
function rptPL(){
  var months={};
  DB.orders.filter(function(o){return o.status!=='ยกเลิก'}).forEach(function(o){
    var d=o.createdAt||'';var m=d.substring(3,10)||'unknown';// MM/YYYY
    if(!months[m]) months[m]={revenue:0,cost:0,orders:0,items:0};
    months[m].revenue+=netOf(o);months[m].cost+=(o.cost||0);months[m].orders++;
    months[m].items+=(o.items||[]).reduce(function(s,it){return s+(it.qty||1)},0);
  });
  // Add expenses
  (DB.expenses||[]).forEach(function(e){
    var d=e.date||'';var m=d.substring(3,10)||'unknown';
    if(!months[m]) months[m]={revenue:0,cost:0,orders:0,items:0};
    months[m].cost+=(e.amount||0);
  });
  var keys=Object.keys(months).sort().reverse();
  var totalRev=0,totalCost=0;
  keys.forEach(function(k){totalRev+=months[k].revenue;totalCost+=months[k].cost});
  var h='<div style="display:flex;justify-content:space-between;align-items:center"><div class="card-title">📊 P&L กำไร/ขาดทุน รายเดือน</div><button class="btn btn-out btn-sm" onclick="exportReportCSV(\'pl\')">📤 Export</button></div>';
  h+='<div class="grid g3" style="margin:12px 0">'+
    '<div class="kpi"><div class="kpi-lbl">รายได้รวม</div><div class="kpi-val">'+thb(totalRev)+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">ต้นทุน+ค่าใช้จ่าย</div><div class="kpi-val" style="color:var(--am)">'+thb(totalCost)+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">กำไรสุทธิ</div><div class="kpi-val" style="color:'+(totalRev-totalCost>0?'var(--gn)':'var(--rd)')+'">'+thb(totalRev-totalCost)+'</div></div></div>';
  h+='<canvas id="chartPL" height="220" style="margin-bottom:12px"></canvas>';
  h+='<table><tr><th>เดือน</th><th>ออเดอร์</th><th>ชิ้น</th><th>รายได้</th><th>ต้นทุน+ค่าใช้จ่าย</th><th>กำไร</th><th>Margin</th></tr>';
  keys.forEach(function(k){
    var d=months[k];var profit=d.revenue-d.cost;var margin=d.revenue>0?Math.round(profit/d.revenue*100):0;
    h+='<tr><td>'+k+'</td><td>'+d.orders+'</td><td>'+d.items+'</td><td>'+thb(d.revenue)+'</td><td style="color:var(--am)">'+thb(d.cost)+'</td><td style="color:'+(profit>0?'var(--gn)':'var(--rd)')+'">'+thb(profit)+'</td><td>'+margin+'%</td></tr>';
  });
  h+='</table>';
  setTimeout(function(){
    if(typeof Chart==='undefined') return;
    var ctx=document.getElementById('chartPL');if(!ctx) return;
    var labels=keys.reverse();
    new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[
      {label:'รายได้',data:labels.map(function(k){return months[k].revenue}),backgroundColor:'#3B82C4',borderRadius:4},
      {label:'ต้นทุน',data:labels.map(function(k){return months[k].cost}),backgroundColor:'#F87171',borderRadius:4},
      {label:'กำไร',data:labels.map(function(k){return months[k].revenue-months[k].cost}),backgroundColor:'#10B981',borderRadius:4}
    ]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return '฿'+v}}}}}});
  },300);
  return h;
}

function exportMonthlyExcel(){
  var csv='เดือน,ออเดอร์,ชิ้น,รายได้,ต้นทุนสินค้า,ค่าใช้จ่าย,ต้นทุนรวม,กำไร,Margin%\n';
  var months={};
  DB.orders.filter(function(o){return o.status!=='ยกเลิก'}).forEach(function(o){
    var d=o.createdAt||'';var m=d.substring(3,10)||'unknown';
    if(!months[m]) months[m]={revenue:0,productCost:0,expense:0,orders:0,items:0};
    months[m].revenue+=netOf(o);months[m].productCost+=(o.cost||0);months[m].orders++;
    months[m].items+=(o.items||[]).reduce(function(s,it){return s+(it.qty||1)},0);
  });
  (DB.expenses||[]).forEach(function(e){
    var d=e.date||'';var m=d.substring(3,10)||'unknown';
    if(!months[m]) months[m]={revenue:0,productCost:0,expense:0,orders:0,items:0};
    months[m].expense+=(e.amount||0);
  });

  c.innerHTML='<div class="tabs"><div class="tab act" onclick="showPriceTab(this,\'overview\')">📊 ภาพรวมราคา</div><div class="tab" onclick="showPriceTab(this,\'cat\')">👕 ซักรีด ('+CAT.length+')</div><div class="tab" onclick="showPriceTab(this,\'bed\')">🛏️ เครื่องนอน</div><div class="tab" onclick="showPriceTab(this,\'cln\')">🧹 ทำความสะอาด</div><div class="tab" onclick="showPriceTab(this,\'wg\')">⚖️ ชั่ง Kg</div><div class="tab" onclick="showPriceTab(this,\'pkg\')">📦 Package</div></div>'+
  '<div class="card" id="priceContent">'+renderPriceOverview()+'</div>';
}
function showPriceTab(el,tab){
  curPriceTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('act')});el.classList.add('act');
  var rc=$('priceContent');
  var eiBar='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><button class="btn btn-out btn-sm" onclick="exportPriceCSV(\''+tab+'\')">📤 Export CSV</button><button class="btn btn-out btn-sm" onclick="downloadPriceTemplate(\''+tab+'\')">📋 Template</button><button class="btn btn-am btn-sm" onclick="triggerImport(\''+tab+'\')">📥 Import CSV</button><input type="file" id="importFile_'+tab+'" accept=".csv" style="display:none" onchange="importPriceCSV(\''+tab+'\',this)"></div>';
  if(tab==='overview') rc.innerHTML=renderPriceOverview();
  else if(tab==='cat') rc.innerHTML=eiBar+'<div style="display:flex;gap:8px;margin-bottom:12px"><div class="search-box" style="flex:1"><input id="priceSearch" placeholder="ค้นหา..." oninput="filterPricelist()"></div><button class="btn btn-out btn-sm" onclick="openCatIconManager()">🎨 ไอคอนหมวด</button><button class="btn btn-pr btn-sm" onclick="openAddPriceItem()">➕ เพิ่มรายการใหม่</button></div><div id="priceList">'+renderPriceTable(CAT)+'</div>';
  else if(tab==='bed') rc.innerHTML=eiBar+renderBedPriceTable();
  else if(tab==='cln') rc.innerHTML=eiBar+renderClnPriceTable();
  else if(tab==='wg') rc.innerHTML=eiBar+renderWeightPriceTable();
  else if(tab==='pkg') rc.innerHTML=eiBar+renderPkgPriceTable();
}
function renderPriceTable(list){
  return '<table><tr><th>หมวด</th><th>ประเภท</th><th>ตัวเลือก</th><th>ราคา</th>'+(canSeeCost()?'<th>ต้นทุน</th><th>กำไร</th>':'')+(canEditPrice()?'<th></th>':'')+'</tr>'+
    list.map(function(it){var idx=CAT.indexOf(it);return '<tr><td>'+it.c+enSmall(it.ce)+'</td><td>'+it.t+enSmall(it.te)+'</td><td>'+(it.o||'-')+enSmall(it.oe)+'</td><td><strong>'+thb(it.p)+'</strong></td>'+(canSeeCost()?'<td>'+thb(it.k)+'</td><td style="color:var(--gn)">'+thb(it.p-it.k)+'</td>':'')+(canEditPrice()?'<td><button class="btn btn-out btn-sm" onclick="openPriceEdit('+idx+')">✏️</button></td>':'')+'</tr>'}).join('')+'</table>';
}
function renderBedPriceTable(){return (canEditPrice()?'<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-pr btn-sm" onclick="openAddBedSet()">➕ เพิ่ม Set ใหม่</button></div>':'')+'<table><tr><th>ขนาด</th><th>รายการ</th><th>ราคา</th>'+(canSeeCost()?'<th>ต้นทุน</th><th>กำไร</th>':'')+(canEditPrice()?'<th></th>':'')+'</tr>'+BED_SETS.map(function(b,i){return '<tr><td><strong>'+b.label+'</strong>'+enSmall(b.labelEn)+'</td><td>'+b.items.join(', ')+'</td><td><strong>'+thb(b.price)+'</strong></td>'+(canSeeCost()?'<td>'+thb(b.cost)+'</td><td style="color:var(--gn)">'+thb(b.price-b.cost)+'</td>':'')+(canEditPrice()?'<td><button class="btn btn-out btn-sm" onclick="openSvcPriceEdit(\'bed\','+i+')">✏️</button></td>':'')+'</tr>'}).join('')+'</table>'}
function renderClnPriceTable(){return (canEditPrice()?'<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-pr btn-sm" onclick="openAddClnSvc()">➕ เพิ่มบริการใหม่</button></div>':'')+'<table><tr><th>ประเภท</th><th>ราคาขั้นต่ำ</th>'+(canSeeCost()?'<th>ต้นทุน</th><th>กำไร</th>':'')+(canEditPrice()?'<th></th>':'')+'</tr>'+CLN_SVCS.map(function(s,i){return '<tr><td><strong>'+s.label+'</strong>'+enSmall(s.labelEn)+'</td><td><strong>'+thb(s.minPrice)+'</strong></td>'+(canSeeCost()?'<td>'+thb(s.cost)+'</td><td style="color:var(--gn)">'+thb(s.minPrice-s.cost)+'</td>':'')+(canEditPrice()?'<td><button class="btn btn-out btn-sm" onclick="openSvcPriceEdit(\'cln\','+i+')">✏️</button></td>':'')+'</tr>'}).join('')+'</table>'}
function renderPkgPriceTable(){return (canEditPrice()?'<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-pr btn-sm" onclick="openAddPkg()">➕ เพิ่ม Package ใหม่</button></div>':'')+'<table><tr><th>ประเภท</th><th>จำนวน</th><th>ราคา</th>'+(canSeeCost()?'<th>ต้นทุน</th><th>กำไร</th>':'')+'<th>อายุ</th>'+(canEditPrice()?'<th></th>':'')+'</tr>'+PKGS.map(function(p,i){return '<tr><td><strong>'+p.type+'</strong>'+enSmall(p.typeEn)+'</td><td>'+p.qty+' ชิ้น</td><td><strong>'+thb(p.price)+'</strong></td>'+(canSeeCost()?'<td>'+thb(p.cost)+'</td><td style="color:var(--gn)">'+thb(p.price-p.cost)+'</td>':'')+'<td>'+p.expDays+' วัน</td>'+(canEditPrice()?'<td><button class="btn btn-out btn-sm" onclick="openSvcPriceEdit(\'pkg\','+i+')">✏️</button></td>':'')+'</tr>'}).join('')+'</table>'}

// ═══ ภาพรวมราคา (Price Overview) — เห็นราคาทุกบริการในหน้าเดียว + แก้ตรงจุด ═══

function ensurePovStyle(){
  if(document.getElementById('povStyle'))return;
  var st=document.createElement('style');st.id='povStyle';
  st.textContent=''+
  '.pov-grid{column-width:280px;column-gap:14px}'+
  '.pov-card{-webkit-column-break-inside:avoid;page-break-inside:avoid;break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;border:1px solid var(--b1);border-radius:12px;overflow:hidden;background:var(--wh);vertical-align:top;box-shadow:var(--sh,0 1px 6px rgba(0,0,0,.05))}'+
  '.pov-card .ph{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--prl);color:var(--pr);font-weight:700;font-size:13px;border-bottom:1px solid var(--b1)}'+
  '.pov-card .ph .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}'+
  '.pov-card .ph .en{font-size:10px;color:var(--pr);opacity:.7;font-weight:600}'+
  '.pov-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px dashed var(--b1);font-size:13px}'+
  '.pov-row:last-child{border-bottom:none}'+
  '.pov-nm{flex:1;min-width:0;line-height:1.25}'+
  '.pov-nm .en{font-size:10px;color:var(--t3)}'+
  '.pov-nm .sub{font-size:10px;color:var(--t3)}'+
  '.pov-typehd{font-size:11px;font-weight:700;color:var(--t2);padding:7px 12px 3px;background:var(--bg)}'+
  '.px-price{font-weight:700;color:var(--pr);cursor:pointer;white-space:nowrap;border-bottom:1px dashed transparent;padding:1px 2px;border-radius:4px}'+
  '.px-price:hover{background:var(--prl);border-bottom-color:var(--pr)}'+
  '.px-ro{font-weight:700;color:var(--t1);white-space:nowrap}'+
  '.px-inp{width:78px;height:28px;text-align:right;font-weight:700;padding:2px 6px;border:2px solid var(--pr);border-radius:6px;font-size:13px}'+
  '@media print{.pov-grid{column-width:auto;column-count:3;column-gap:10px}.pov-card{box-shadow:none}.px-price{color:#000!important}}';
  document.head.appendChild(st);
}
// จัดกลุ่ม CAT ตามหมวด (คงลำดับเดิม) → [{c, ce, items:[{it,idx}]}]
function povCatGroups(){
  var order=[],map={};
  CAT.forEach(function(it,idx){
    if(!map[it.c]){map[it.c]={c:it.c,ce:it.ce||'',items:[]};order.push(it.c)}
    if(!map[it.c].ce&&it.ce)map[it.c].ce=it.ce;
    map[it.c].items.push({it:it,idx:idx});
  });
  return order.map(function(k){return map[k]});
}
// ราคาแบบแตะแก้ได้ (inline) — kind: cat|bed|cln|pkg
function pxPriceHTML(kind,idx){
  var v=pxGet(kind,idx);
  if(!canEditPrice())return '<span class="px-ro">'+thb(v)+'</span>';
  return '<span class="px-price" onclick="pxEdit(this,\''+kind+'\','+idx+')" title="แตะเพื่อแก้ราคา">'+thb(v)+'</span>';
}
function pxGet(kind,idx){
  if(kind==='cat')return (CAT[idx]||{}).p||0;
  if(kind==='bed')return (BED_SETS[idx]||{}).price||0;
  if(kind==='cln')return (CLN_SVCS[idx]||{}).minPrice||0;
  if(kind==='pkg')return (PKGS[idx]||{}).price||0;
  return 0;
}
function pxSet(kind,idx,v){
  if(kind==='cat'&&CAT[idx])CAT[idx].p=v;
  else if(kind==='bed'&&BED_SETS[idx])BED_SETS[idx].price=v;
  else if(kind==='cln'&&CLN_SVCS[idx])CLN_SVCS[idx].minPrice=v;
  else if(kind==='pkg'&&PKGS[idx])PKGS[idx].price=v;
}
function pxEdit(el,kind,idx){
  if(!canEditPrice()){toast('⛔ เฉพาะเจ้าของร้าน/ผู้จัดการเท่านั้น','err');return}
  var cur=pxGet(kind,idx);
  var inp=document.createElement('input');
  inp.type='number';inp.min='0';inp.step='1';inp.value=cur;inp.className='px-inp';
  inp.dataset.kind=kind;inp.dataset.idx=idx;
  el.replaceWith(inp);inp.focus();inp.select();
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();inp.blur()}
    else if(e.key==='Escape'){e.preventDefault();inp._cancel=true;inp.blur()}
  });
  inp.addEventListener('blur',function(){pxCommit(inp)});
}
function pxCommit(inp){
  if(inp._done)return;inp._done=true;
  var kind=inp.dataset.kind,idx=parseInt(inp.dataset.idx,10);
  if(!inp._cancel){
    var v=parseFloat(inp.value);
    if(!isNaN(v)&&v>=0){
      var old=pxGet(kind,idx);
      if(v!==old){
        pxSet(kind,idx,v);
        saveDB();if(typeof pushPriceToCloud==='function')pushPriceToCloud();
        logAction('EDIT_PRICE','ภาพรวม '+kind+' idx:'+idx+' → '+thb(v));
        toast('บันทึกราคา ✅ '+thb(v));
      }
    }
  }
  var tmp=document.createElement('span');tmp.innerHTML=pxPriceHTML(kind,idx);
  var node=tmp.firstChild;inp.replaceWith(node);
}
// สร้างการ์ดทั้งหมด (forPrint = true → ราคาเป็นข้อความเฉยๆ ไม่มีปุ่มแก้)
function povCards(q,forPrint){
  q=(q||'').toLowerCase();
  function keep(txt){return !q||String(txt).toLowerCase().indexOf(q)>=0}
  function pr(kind,idx){return forPrint?'<span class="px-ro">'+thb(pxGet(kind,idx))+'</span>':pxPriceHTML(kind,idx)}
  // ตอนพิมพ์: ตัดการ์ดที่ยาวเกินหน้า A4 เป็นหลายใบ (ป้องกันหน้าแรกว่าง) · บนจอ: การ์ดเดียว (masonry จัดการเอง)
  var CHUNK=forPrint?20:100000;
  function emitCard(headHTML,rowArr){
    if(!rowArr.length)return '';
    if(rowArr.length<=CHUNK)return '<div class="pov-card"><div class="ph">'+headHTML+'</div>'+rowArr.join('')+'</div>';
    var out='';
    for(var i=0;i<rowArr.length;i+=CHUNK){
      var cont=i>0?' <span style="font-size:9px;opacity:.7;font-weight:400">(ต่อ)</span>':'';
      out+='<div class="pov-card"><div class="ph">'+headHTML+cont+'</div>'+rowArr.slice(i,i+CHUNK).join('')+'</div>';
    }
    return out;
  }
  var cards='';
  // 1) ซักรีด/ซักแห้ง — แยกตามหมวด
  povCatGroups().forEach(function(g){
    var rowArr=g.items.filter(function(o){return keep(g.c)||keep(o.it.t)||keep(o.it.o)||keep(g.ce)||keep(o.it.te)}).map(function(o){
      var it=o.it;
      var nm='<div class="pov-nm"><div>'+it.t+(it.o?' <span style="color:var(--t3)">· '+it.o+'</span>':'')+'</div>'+((it.te||it.oe)?'<div class="en">'+[it.te,it.oe].filter(Boolean).join(' · ')+'</div>':'')+'</div>';
      return '<div class="pov-row">'+nm+pr('cat',o.idx)+'</div>';
    });
    cards+=emitCard('<span class="ic">'+catIconHTML(g.c,20)+'</span><span>'+g.c+(g.ce?' <span class="en">'+g.ce+'</span>':'')+'</span>',rowArr);
  });
  // 2) ชุดเครื่องนอน
  var bedRows=BED_SETS.map(function(b,i){return {b:b,i:i}}).filter(function(o){return keep(o.b.label)||keep(o.b.labelEn)||keep('เครื่องนอน')||keep((o.b.items||[]).join(' '))}).map(function(o){
    var b=o.b;
    var nm='<div class="pov-nm"><div>'+b.label+'</div>'+(b.labelEn?'<div class="en">'+b.labelEn+'</div>':'')+((b.items&&b.items.length)?'<div class="sub">'+b.items.join(', ')+'</div>':'')+'</div>';
    return '<div class="pov-row">'+nm+pr('bed',o.i)+'</div>';
  });
  cards+=emitCard('<span class="ic">🛏️</span><span>ชุดเครื่องนอน <span class="en">Bed & Bath</span></span>',bedRows);
  // 3) ทำความสะอาด
  var clnRows=CLN_SVCS.map(function(s,i){return {s:s,i:i}}).filter(function(o){return keep(o.s.label)||keep(o.s.labelEn)||keep('ทำความสะอาด')}).map(function(o){
    var s=o.s;
    var nm='<div class="pov-nm"><div>'+s.label+'</div>'+(s.labelEn?'<div class="en">'+s.labelEn+'</div>':'')+'<div class="sub">ราคาเริ่มต้น</div></div>';
    return '<div class="pov-row">'+nm+pr('cln',o.i)+'</div>';
  });
  cards+=emitCard('<span class="ic">🧹</span><span>ทำความสะอาด <span class="en">Cleaning</span></span>',clnRows);
  // 4) ชั่งกิโล (แสดงเรทตามน้ำหนัก + ปุ่มแก้ละเอียด)
  var svcs=(typeof getWeightSvcs==='function')?getWeightSvcs():[];
  var wgRows=svcs.map(function(s,i){return {s:s,i:i}}).filter(function(o){return keep(o.s.label)||keep('ชั่งกิโล')||keep('kg')}).map(function(o){
    var s=o.s;
    var edit=(!forPrint&&canEditPrice())?'<button class="btn btn-out btn-sm" style="padding:2px 8px;min-height:0;height:26px" onclick="openWeightSvcEdit('+o.i+')">✏️</button>':'';
    var nm='<div class="pov-nm"><div>'+s.label+(s.minKg>0?' <span style="color:var(--t3);font-size:10px">(ขั้นต่ำ '+s.minKg+'กก.)</span>':'')+'</div><div class="sub">'+wTierSummary(s)+'</div></div>';
    return '<div class="pov-row">'+nm+edit+'</div>';
  }).join('');
  if(wgRows)cards+='<div class="pov-card"><div class="ph"><span class="ic">⚖️</span><span>ชั่งกิโล (บาท/กก.) <span class="en">By Weight</span></span></div>'+wgRows+'</div>';
  // 5) Package — จัดกลุ่มตามประเภท
  var pkgOrder=[],pkgMap={};
  PKGS.forEach(function(p,i){if(!pkgMap[p.type]){pkgMap[p.type]={type:p.type,typeEn:p.typeEn||'',items:[]};pkgOrder.push(p.type)}pkgMap[p.type].items.push({p:p,i:i})});
  var pkgInner='';
  pkgOrder.forEach(function(k){
    var g=pkgMap[k];
    var rows=g.items.filter(function(o){return keep(g.type)||keep(g.typeEn)||keep('package')||keep('แพ็ก')}).map(function(o){
      var p=o.p;
      var nm='<div class="pov-nm"><div>'+p.qty+' ชิ้น'+(p.expDays?' <span style="color:var(--t3);font-size:10px">· '+p.expDays+' วัน</span>':' <span style="color:var(--t3);font-size:10px">· ไม่หมดอายุ</span>')+'</div></div>';
      return '<div class="pov-row">'+nm+pr('pkg',o.i)+'</div>';
    }).join('');
    if(rows)pkgInner+='<div class="pov-typehd">'+g.type+(g.typeEn?' <span style="font-weight:400;color:var(--t3)">'+g.typeEn+'</span>':'')+'</div>'+rows;
  });
  if(pkgInner)cards+='<div class="pov-card"><div class="ph"><span class="ic">📦</span><span>แพ็กเกจ <span class="en">Package</span></span></div>'+pkgInner+'</div>';
  return cards||'<div class="empty-state"><div class="es-text">ไม่พบรายการที่ค้นหา</div></div>';
}
function renderPriceOverview(){
  ensurePovStyle();
  var s=(typeof getShopSettings==='function')?getShopSettings():{};
  var name=(s&&s.shopName)||'ร้านซักกะนิด';
  var canEd=canEditPrice();
  var total=CAT.length+BED_SETS.length+CLN_SVCS.length+PKGS.length+((typeof getWeightSvcs==='function')?getWeightSvcs().length:0);
  var head='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px">'+
    '<div><div style="font-size:16px;font-weight:800;color:var(--pr)">📊 ค่าบริการซักผ้า — '+name+'</div>'+
    '<div style="font-size:12px;color:var(--t3)">เปิดทุกวัน 10:00–20:00 · รวม '+total+' รายการ'+(canEd?' · <span style="color:var(--pr)">แตะที่ราคาเพื่อแก้ไขได้ทันที</span>':'')+'</div></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-out btn-sm" onclick="printPriceSheet()">🖨️ พิมพ์ตารางราคา</button></div>'+
    '</div>';
  var search='<div class="search-box" style="margin-bottom:12px"><input id="povSearch" placeholder="🔎 ค้นหาบริการ / ประเภท / ราคา..." oninput="povFilter()"></div>';
  return head+search+'<div id="povGrid" class="pov-grid">'+povCards('',false)+'</div>';
}
function povFilter(){
  var q=($('povSearch')?$('povSearch').value:'')||'';
  var g=$('povGrid');if(g)g.innerHTML=povCards(q,false);
}

  var css=''+

  var body='<div class="head">'+logo+'<div class="t">ค่าบริการซักผ้า '+name+'</div>'+

function saveWeightSvc(i){

  if(!label){toast('กรุณากรอกชื่อบริการ','err');return}

  var minKg=parseFloat($('wsp-minkg')?$('wsp-minkg').value:0)||0;
  var tiers=(window._wgEditTiers||[]).map(function(t){return {max:parseFloat(t.max)||0,rate:parseFloat(t.rate)||0}});
  if(!tiers.length)tiers=[{max:0,rate:0}];
  // ช่วงสุดท้ายบังคับเป็นไม่จำกัด (max:0)

  var s=getShopSettings();

function saveSvcPrice(type,i){

  var mo=$('moPE2');if(mo)mo.remove();refreshPriceTab();

  if(!confirm('ลบ "'+name+'" ?')) return;

function csvQ(s){s=String(s);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}
function downloadCSV(csv,filename){
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  toast('📤 Export สำเร็จ — '+filename);
}
function parseCSV(text){
  var lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var rows=[];
  for(var i=0;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    var cols=[];var cur='';var inQ=false;
    for(var j=0;j<lines[i].length;j++){
      var ch=lines[i][j];
      if(inQ){if(ch==='"'&&lines[i][j+1]==='"'){cur+='"';j++}else if(ch==='"'){inQ=false}else{cur+=ch}}
      else{if(ch==='"'){inQ=true}else if(ch===','){cols.push(cur.trim());cur=''}else{cur+=ch}}
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

    bed:{name:'เครื่องนอน',list:function(){return BED_SETS}},

function parseTierStr(s){
  s=String(s||'').trim();var tiers=[];
  s.split('|').forEach(function(part){part=part.trim();if(!part)return;var kv=part.split(':');tiers.push({max:parseFloat(kv[0])||0,rate:parseFloat(kv[1])||0})});
  if(!tiers.length)tiers=[{max:0,rate:0}];
  return tiers;
}

  else if(tab==='bed'){rows.forEach(function(r){if(r.length<5||!r[0])return;tmp.push({size:r[0],label:r[1]||r[0],labelEn:r[2]||'',price:parseFloat(r[3])||0,cost:parseFloat(r[4])||0,items:[]})})}
  else if(tab==='cln'){rows.forEach(function(r){if(r.length<5||!r[0])return;tmp.push({type:r[0],label:r[1]||r[0],labelEn:r[2]||'',minPrice:parseFloat(r[3])||0,cost:parseFloat(r[4])||0})})}

    rows.forEach(function(r){
      if(r.length<3||!r[0]) return;
      var name=r[0];var nick=r[1]||'';var phone=String(r[2]||'').replace(/[^0-9]/g,'');
      if(!phone){skip++;return}
      // เช็คซ้ำโดยเบอร์โทร
      var existing=DB.members.find(function(m){return m.phone.replace(/[^0-9]/g,'')===phone});
      if(existing){skip++;return}
      var m={id:genId('SKN'),name:name,nick:nick,phone:phone,addrType:r[3]||'condo',proj:r[4]||'',room:r[5]||'',village:r[6]||'',houseNo:r[7]||'',lineId:r[8]||'',lineUserId:'',pts:50,spend:0,level:'ทั่วไป',joinDate:fmtDate(),pdpaConsent:true};
      DB.members.push(m);count++;
    });
    saveDB();logAction('IMPORT_MEMBERS',count+' new, '+skip+' skipped');
    toast('📥 Import สมาชิก — เพิ่ม '+count+' คน'+(skip?' (ข้าม '+skip+' ซ้ำ/ไม่มีเบอร์)':''));
    renderPage('members');
  };
  reader.readAsText(fileInput.files[0]);
  fileInput.value='';
}

async function testApiConnection(){
  var url=$('cn-api-url')?$('cn-api-url').value.trim():'';
  if(!url){toast('กรอก URL ก่อน','err');return}
  toast('🔌 กำลังทดสอบ...','info');
  try{
    var data=await new Promise(function(resolve,reject){
      var cbName='_test_'+Date.now();
      var timeout=setTimeout(function(){delete window[cbName];reject(new Error('Timeout — ตรวจสอบ URL หรือ Deploy ใหม่'))},15000);
      window[cbName]=function(d){clearTimeout(timeout);delete window[cbName];resolve(d)};
      var sc=document.createElement('script');
      sc.src=url+'?action=ping&callback='+cbName;
      sc.onerror=function(){clearTimeout(timeout);delete window[cbName];reject(new Error('ไม่สามารถเชื่อมต่อ URL นี้ได้'))};
      document.head.appendChild(sc);
    });
    if(data.ok) toast('✅ เชื่อมต่อสำเร็จ! API v'+(data.v||'?'));
    else toast('❌ API ตอบกลับผิดพลาด','err');
  }catch(err){toast('❌ '+err.message,'err')}
}

async function clearOrdersOnly(){
  if(!curUser||curUser.role!=='เจ้าของร้าน'){toast('⛔ เฉพาะเจ้าของร้าน','err');return}
  if(!confirm('⚠️ ล้างประวัติออเดอร์ทั้งหมด?\n\nออเดอร์ '+(DB.orders||[]).length+' รายการจะถูกลบ (ทั้งในเครื่องและ Cloud)\n(สมาชิก ตารางราคา ตั้งค่า จะยังอยู่)\n\nยืนยัน?')) return;

  DB.orders=[];DB.docs=[];DB.orderSeq=0;saveDB();
  // ล้างใน Google Sheets ด้วย (ทุก sheet ที่เก็บออเดอร์)

    toast('🔄 กำลังล้างข้อมูลใน Cloud...','info');
    var orderSheets=['orders','orders_laundry','orders_package','orders_bedset','orders_cleaning','docs'];
    var cleared=0;
    for(var i=0;i<orderSheets.length;i++){
      try{
        var r=await jsonpCall('clearSheet',orderSheets[i]);
        if(r&&r.ok) cleared++;
      }catch(e){}
    }
    toast('🗑️ ล้างประวัติออเดอร์แล้ว ('+cleared+' sheets) ✅');
  }else{
    toast('🗑️ ล้างประวัติออเดอร์แล้ว ✅');
  }

  renderPage(curPage);

function exportBackup(){
  const backup={_backup:{version:'4.0',app:'SAKKANID Laundry POS',exportDate:new Date().toISOString(),exportBy:curUser?curUser.nick:'',counts:{orders:DB.orders.length,members:DB.members.length,quotas:(DB.quotas||[]).length,promos:(DB.promos||[]).length}},...DB};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='SAKKANID_backup_'+todayStr().replace(/-/g,'')+'.json';
  a.click();toast('Export Backup สำเร็จ ✅');
  logAction('EXPORT_DATA','Export backup');
}
function importBackupClick(){$('importFile').click()}
function importBackup(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data._backup||!data.orders){toast('ไม่ใช่ไฟล์ Backup ของ SAKKANID','err');return}
      const cnt=data._backup.counts||{};
      if(!confirm('จะ Import ข้อมูล:\n• ออเดอร์: '+(cnt.orders||0)+'\n• สมาชิก: '+(cnt.members||0)+'\n\n⚠️ ข้อมูลเดิมจะถูกทับ — ยืนยัน?')) return;
      // Auto-backup before import
      exportBackup();
      // Import
      DB=data;delete DB._backup;saveDB();
      logAction('IMPORT_DATA','Import backup');
      toast('Import สำเร็จ ✅ รีโหลดหน้า...');
      setTimeout(()=>location.reload(),1000);
    }catch(err){toast('ไฟล์ไม่ถูกต้อง: '+err.message,'err')}
  };reader.readAsText(file);
}

function uqSave(){

function savePriceEdit(idx){
  if(!canEditPrice()){toast("⛔ ไม่มีสิทธิ์","err");return}
  var it=CAT[idx];if(!it) return;
  var c=$('pe-c').value.trim(),t=$('pe-t').value.trim();
  if(!c||!t){toast('กรอกหมวดบริการและประเภทผ้า','err');return}
  it.c=c;it.ce=$('pe-ce').value.trim();it.t=t;it.te=$('pe-te').value.trim();
  it.o=$('pe-o').value.trim();it.oe=$('pe-oe').value.trim();
  it.p=parseFloat($('pe-price').value)||0;it.k=parseFloat($('pe-cost').value)||0;
  it.pt=$('pe-pt')?$('pe-pt').value:(it.pt||'fixed');it.sku=$('pe-sku').value.trim();
  CATS_UNIQUE.length=0;[...new Set(CAT.map(function(x){return x.c}))].forEach(function(cc){CATS_UNIQUE.push(cc)});
  logAction('EDIT_PRICE',it.c+' '+it.t+' → '+thb(it.p));
  saveDB();if(typeof pushPriceToCloud==='function')pushPriceToCloud();
  toast('บันทึกสำเร็จ ✅');
  const mo=$('moPriceEdit');if(mo) mo.remove();
  refreshPriceTab();
}
function deletePriceItem(idx){
  if(!canEditPrice()){toast("⛔ ไม่มีสิทธิ์","err");return}
  var it=CAT[idx];if(!it) return;

function getActiveShift(){return (DB.shifts||[]).find(s=>!s.closedAt)}
function openShift(){
  const active=getActiveShift();
  if(active){toast('กะยังเปิดอยู่ โดย '+active.openedBy,'warn');return}
  const cashStart=prompt('เงินสดเริ่มต้น (ทอน) ฿:','1000');
  if(cashStart===null) return;
  if(!DB.shifts) DB.shifts=[];
  DB.shifts.push({id:'SFT-'+String(DB.shifts.length+1).padStart(4,'0'),openedBy:curUser.nick,openedAt:fmtDT(),closedBy:'',closedAt:'',cashStart:parseFloat(cashStart)||0,cashEnd:0,systemCash:0,diff:0,totalSales:0,orderCount:0,note:''});
  saveDB();logAction('OPEN_SHIFT','เปิดกะ เงินสดเริ่ม '+thb(cashStart));
  toast('เปิดกะสำเร็จ ✅ เงินสดเริ่มต้น '+thb(cashStart));renderPage(curPage);
}
function closeShift(){
  const active=getActiveShift();
  if(!active){toast('ไม่มีกะที่เปิดอยู่','warn');return}
  const cashEnd=prompt('นับเงินสดจริง (฿):','');
  if(cashEnd===null) return;
  // Calculate system cash for this shift
  const shiftOrders=DB.orders.filter(o=>o.createdAt>=active.openedAt&&o.status!=='ยกเลิก');
  const cashPayments=shiftOrders.reduce((s,o)=>{
    return s+(o.payHist||[]).filter(p=>p.method==='เงินสด'&&p.date>=active.openedAt).reduce((ss,p)=>ss+p.amt,0);
  },0);
  active.closedBy=curUser.nick;active.closedAt=fmtDT();
  active.cashEnd=parseFloat(cashEnd)||0;
  active.systemCash=active.cashStart+cashPayments;
  active.diff=active.cashEnd-active.systemCash;
  active.totalSales=shiftOrders.reduce((s,o)=>s+netOf(o),0);
  active.orderCount=shiftOrders.length;
  saveDB();logAction('CLOSE_SHIFT','ปิดกะ เงินสดจริง '+thb(cashEnd)+' ระบบ '+thb(active.systemCash)+' ผลต่าง '+thb(active.diff));
  toast('ปิดกะสำเร็จ ✅ ผลต่าง: '+thb(active.diff)+(active.diff>=0?' (เกิน)':' (ขาด)'));
  renderPage(curPage);
}

// ═══ โหลดประวัติการส่ง LINE ของสมาชิก (จาก line_log ใน Cloud) ═══
async function loadMemberLineLog(uid){
  var box=$('memLineLog');if(!box) return;
  var apiUrl=getApiUrl();
  if(!apiUrl){box.innerHTML='<span style="color:var(--rd)">⚠️ ยังไม่ได้เชื่อม Cloud</span>';return}
  box.innerHTML='⏳ กำลังโหลด...';
  try{
    var result=await new Promise(function(resolve,reject){
      var cbName='_lgcb_'+Date.now();
      window[cbName]=function(r){delete window[cbName];resolve(r)};
      var sc=document.createElement('script');
      sc.src=apiUrl+'?action=getLineLog&uid='+encodeURIComponent(uid)+'&callback='+cbName;
      sc.onerror=function(){delete window[cbName];reject(new Error('เชื่อมต่อไม่ได้'))};
      document.head.appendChild(sc);
      setTimeout(function(){if(window[cbName]){delete window[cbName];reject(new Error('Timeout'))}},20000);
    });
    var rows=(result&&result.ok&&result.data)?result.data:[];
    if(!rows.length){box.innerHTML='<span style="color:var(--t3)">ยังไม่มีประวัติการส่ง LINE ให้ลูกค้ารายนี้</span>';return}
    box.innerHTML='<table style="font-size:12px"><tr><th>เมื่อไหร่</th><th>ส่งอะไร</th><th>สถานะ</th></tr>'+
      rows.map(function(r){
        var ok=(r.status==='ส่งสำเร็จ');
        var dt=fmtLineLogTime(r.timestamp);
        return '<tr><td style="white-space:nowrap">'+dt+'</td><td>'+(r.type||'-')+'</td><td>'+(ok?'<span class="badge bg-gn">✅ ส่งสำเร็จ</span>':'<span class="badge bg-rd">❌ '+(r.status||'ล้มเหลว')+'</span>')+(r.detail?'<div style="font-size:10px;color:var(--t3)">'+r.detail+'</div>':'')+'</td></tr>';
      }).join('')+'</table>'+
      '<div style="font-size:10px;color:var(--t3);margin-top:6px">* "ส่งสำเร็จ" = LINE รับข้อความไปส่งต่อแล้ว (LINE ไม่เปิดให้เช็คว่าลูกค้าอ่านหรือยัง)</div>';
  }catch(e){box.innerHTML='<span style="color:var(--rd)">❌ โหลดไม่ได้: '+e.message+'</span>'}
}
function fmtLineLogTime(iso){
  try{
    var d=new Date(iso);if(isNaN(d.getTime()))return iso;
    var p=function(n){return String(n).padStart(2,'0')};
    return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){return iso}
}

function saveEditMember(mid){

  m.name=$('em-name').value.trim()||m.name;m.nick=$('em-nick').value.trim();

  m.lineUserId=$('em-line-uid')?$('em-line-uid').value.trim():'';

function deleteMember(mid){

  if(!confirm('ลบสมาชิก '+m.name+' ('+m.id+') ?\n\nข้อมูลจะถูกลบถาวร')) return;
  // ── tombstone: กันไม่ให้ autoPull ดึงสมาชิกที่เพิ่งลบกลับมา ──
  DB.deletedMembers=DB.deletedMembers||{};
  DB.deletedMembers[mid]=new Date().getTime();

  if(getApiUrl()&&typeof syncPushAll==='function'&&curUser) syncPushAll(true);
  logAction('DELETE_MEMBER',mid+' '+m.name);
  toast('🗑️ ลบสมาชิก '+m.name+' แล้ว');

}

function showLinePreview(oid){
  const o=gO(oid);if(!o) return;
  const s=getShopSettings();const paid=isPaidCheck(o);
  const m=gM(o.mid);const hasLineId=m&&m.lineUserId;
  let msg;
  if(memLang(m)==='en'){
    msg='Hi '+o.mname+' 🫧\n'+s.shopName+'\n\nOrder: '+o.id+'\nStatus: '+statusEn(o.status)+'\nAmount: '+thb(o.net);
    msg+= paid?'\n\n✅ Paid in full':'\n\n❌ Outstanding: '+thb(remaining(o))+'\nPlease pay via the QR below 🙏';
    msg+='\n\nThank you 💙';
  }else{
    msg='สวัสดีค่ะ '+o.mname+' 🫧\nร้าน '+s.shopName+'\n\nเลขออเดอร์: '+o.id+'\nสถานะ: '+o.status+'\nยอด: '+thb(o.net);
    msg+= paid?'\n\n✅ ชำระเงินครบแล้ว':'\n\n❌ ยอดค้างชำระ: '+thb(remaining(o))+'\nกรุณาชำระตาม QR ด้านล่าง 🙏';
    msg+='\n\nขอบคุณที่ใช้บริการค่ะ 💙';
  }
  const h='<div class="modal-overlay show" id="moLine"><div class="modal"><div class="modal-head"><h3>📱 LINE Preview</h3><button class="modal-close" onclick="document.getElementById(\'moLine\').remove()">&times;</button></div>'+
    '<div class="modal-body"><div style="display:flex;justify-content:center;margin-bottom:12px">'+
    '<div style="background:#7BC67E;border-radius:16px;padding:14px 16px;max-width:300px;color:#fff;font-size:13px;white-space:pre-line;line-height:1.6">'+msg+'</div></div>'+
    (hasLineId?'<div style="text-align:center;font-size:12px;color:var(--gn)">✅ LINE User ID: '+m.lineUserId.substring(0,8)+'...</div>':'<div style="text-align:center;font-size:12px;color:var(--am)">⚠️ ลูกค้ายังไม่มี LINE User ID<br><span style="font-size:11px;color:var(--t3)">ลูกค้าต้อง Add LINE OA ก่อน → ระบบจะได้ User ID อัตโนมัติ</span></div>')+
    '</div>'+
    '<div class="modal-foot" style="flex-wrap:wrap;gap:4px"><button class="btn btn-out" onclick="document.getElementById(\'moLine\').remove()">ปิด</button><button class="btn btn-out" onclick="copyLineMsg()">📋 Copy</button>'+
    '<button class="btn btn-gn" onclick="sendBillViaLine(\''+oid+'\');document.getElementById(\'moLine\').remove()" '+(hasLineId?'':'disabled style="opacity:.5"')+'>📱 ส่งบิลทาง LINE</button>'+
    '<button class="btn btn-out" onclick="sendStatusViaLine(\''+oid+'\');document.getElementById(\'moLine\').remove()" '+(hasLineId?'':'disabled style="opacity:.5"')+'>📋 แจ้งสถานะ</button>'+
    '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  window._lineMsg=msg;
}
function copyLineMsg(){
  if(window._lineMsg){navigator.clipboard.writeText(window._lineMsg).then(()=>toast('Copy สำเร็จ ✅')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=window._lineMsg;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copy สำเร็จ ✅');
  })}
}

// ═══ DUPLICATE ORDER ═══
function duplicateOrder(oid){
  const o=gO(oid);if(!o) return;
  if(!confirm('สร้างออเดอร์ซ้ำจาก '+oid+' ?')) return;
  const newO={...JSON.parse(JSON.stringify(o)),id:genId('LDR'),status:'รับผ้ารอส่งซัก',payHist:[],isPaid:false,createdAt:fmtDT(),by:curUser.nick};
  DB.orders.push(newO);saveDB();
  logAction('CREATE_ORDER',newO.id+' (ซ้ำจาก '+oid+')');
  toast('สร้างออเดอร์ซ้ำสำเร็จ ✅ '+newO.id);renderPage(curPage);
}

// ═══ TOGGLE URGENT ═══
function toggleUrgent(oid){
  const o=gO(oid);if(!o) return;
  o.urgent=!o.urgent;saveDB();
  toast(o.urgent?'🔴 ตั้งเป็นด่วน':'ยกเลิกด่วน');renderPage(curPage);
}

function printMemberCard(){
  var el=$('memberCardEl');if(!el) return;
  var pa=$('printArea');
  // เพิ่ม style บังคับพิมพ์สี
  var oldStyle=document.getElementById('mcPrintStyle');if(oldStyle) oldStyle.remove();
  var st=document.createElement('style');st.id='mcPrintStyle';
  st.innerHTML='@media print{#printArea,#printArea *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}#printArea{width:auto!important;font-weight:normal!important}@page{size:auto;margin:10mm}}';
  document.head.appendChild(st);
  pa.className='';pa.innerHTML=el.outerHTML;pa.style.display='block';
  window.print();
  setTimeout(function(){pa.style.display='none';if(st)st.remove()},500);

// ═══ EXPENSE TRACKING ═══
function renderExpensePage(c){
  if(!c) c=$('mainContent');
  if(!DB.expenses) DB.expenses=[];
  var expenses=DB.expenses.slice(-50).reverse();
  var totalMonth=DB.expenses.filter(function(e){return (e.date||'').includes('/'+String(new Date().getMonth()+1)+'/')}).reduce(function(s,e){return s+e.amount},0);
  c.innerHTML=
    '<div class="grid g3" style="margin-bottom:16px">'+
    '<div class="kpi"><div class="kpi-lbl">ค่าใช้จ่ายเดือนนี้</div><div class="kpi-val" style="color:var(--rd)">'+thb(totalMonth)+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">รายการทั้งหมด</div><div class="kpi-val">'+DB.expenses.length+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">ค่าใช้จ่ายรวม</div><div class="kpi-val" style="color:var(--am)">'+thb(DB.expenses.reduce(function(s,e){return s+e.amount},0))+'</div></div></div>'+
    '<div class="card"><div class="card-title">💸 บันทึกค่าใช้จ่าย</div>'+
    '<div class="grid g3" style="gap:6px;margin-bottom:10px">'+
    '<div class="form-group"><label class="form-label">หมวด</label><div style="display:flex;gap:4px"><select id="exp-cat" style="flex:1">'+getExpenseCategories().map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><button class="btn btn-out btn-sm" onclick="addExpenseCategory()" title="เพิ่มหมวดใหม่">+</button></div></div>'+
    '<div class="form-group"><label class="form-label">รายการ</label><input id="exp-name" placeholder="เช่น น้ำยาซักผ้า"></div>'+
    '<div class="form-group"><label class="form-label">จำนวนเงิน (฿)</label><input id="exp-amt" type="number"></div></div>'+
    '<button class="btn btn-am" onclick="saveExpense()">💾 บันทึกค่าใช้จ่าย</button></div>'+
    '<div class="card"><div class="card-title">📋 รายการล่าสุด</div>'+
    (expenses.length?'<table><tr><th>วันที่</th><th>หมวด</th><th>รายการ</th><th>จำนวน</th><th>โดย</th>'+(curUser&&curUser.role==='เจ้าของร้าน'?'<th>จัดการ</th>':'')+'</tr>'+
    expenses.map(function(e,idx){var ri=DB.expenses.length-1-idx;return '<tr><td style="font-size:11px">'+fmtJoinDate(e.date)+'</td><td><span class="badge bg-am">'+e.category+'</span></td><td>'+e.name+'</td><td style="color:var(--rd);font-weight:700">'+thb(e.amount)+'</td><td>'+e.by+'</td>'+(curUser&&curUser.role==='เจ้าของร้าน'?'<td><button class="btn btn-out btn-sm" onclick="editExpense('+ri+')">✏️</button> <button class="btn btn-out btn-sm" onclick="deleteExpense('+ri+')">🗑️</button></td>':'')+'</tr>'}).join('')+'</table>':'<div class="empty-state"><div class="es-text">ยังไม่มีค่าใช้จ่าย</div></div>')+'</div>';
}
function saveExpense(){
  var cat=$('exp-cat')?$('exp-cat').value:'';
  var name=$('exp-name')?$('exp-name').value.trim():'';
  var amt=parseFloat($('exp-amt')?$('exp-amt').value:0)||0;
  if(!name||!amt){toast('กรอกรายการและจำนวนเงิน','err');return}
  if(!DB.expenses) DB.expenses=[];
  DB.expenses.push({id:'EXP-'+String(DB.expenses.length+1).padStart(4,'0'),category:cat,name:name,amount:amt,date:fmtJoinDate(new Date().toISOString()),by:curUser.nick});
  saveDB();logAction('ADD_EXPENSE',name+' '+thb(amt));
  toast('บันทึกค่าใช้จ่าย ✅ '+thb(amt));renderPage('expense');
}
function getExpenseCategories(){
  var defaults=['วัสดุสิ้นเปลือง','ค่าสาธารณูปโภค','ค่าแรง','ซ่อมบำรุง','ค่าเช่า','ค่าขนส่ง','วัตถุดิบ','อื่นๆ'];
  var custom=getShopSettings().expenseCategories||[];
  return defaults.concat(custom.filter(function(c){return defaults.indexOf(c)<0}));
}
function addExpenseCategory(){
  var name=prompt('ชื่อหมวดค่าใช้จ่ายใหม่:');
  if(!name||!name.trim()) return;
  var s=getShopSettings();if(!s.expenseCategories) s.expenseCategories=[];
  if(getExpenseCategories().indexOf(name.trim())>=0){toast('หมวดนี้มีอยู่แล้ว','warn');return}
  s.expenseCategories.push(name.trim());saveDB();
  toast('เพิ่มหมวด "'+name.trim()+'" สำเร็จ ✅');renderPage('expense');
}
function editExpense(idx){
  if(!curUser||curUser.role!=='เจ้าของร้าน'){toast('เฉพาะเจ้าของร้าน','err');return}
  var e=DB.expenses[idx];if(!e) return;
  var h='<div class="modal-overlay show" id="moExpEdit"><div class="modal" style="max-width:480px"><div class="modal-head"><h3>✏️ แก้ไขค่าใช้จ่าย</h3><button class="modal-close" onclick="document.getElementById(\'moExpEdit\').remove()">&times;</button></div>'+
    '<div class="modal-body">'+
    '<div class="form-group"><label class="form-label">หมวด</label><select id="ee-cat">'+getExpenseCategories().map(function(c){return '<option'+(c===e.category?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>'+
    '<div class="form-group"><label class="form-label">รายการ</label><input id="ee-name" value="'+e.name+'"></div>'+
    '<div class="form-group"><label class="form-label">จำนวนเงิน (฿)</label><input id="ee-amt" type="number" value="'+e.amount+'"></div>'+
    '</div><div class="modal-foot"><button class="btn btn-out" onclick="document.getElementById(\'moExpEdit\').remove()">ยกเลิก</button><button class="btn btn-gn" onclick="saveEditExpense('+idx+')">💾 บันทึก</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function saveEditExpense(idx){
  var e=DB.expenses[idx];if(!e) return;
  e.category=$('ee-cat').value;
  e.name=$('ee-name').value.trim();
  e.amount=parseFloat($('ee-amt').value)||0;
  saveDB();logAction('EDIT_EXPENSE',e.id+' '+e.name+' '+thb(e.amount));
  toast('✏️ แก้ไขค่าใช้จ่ายสำเร็จ ✅');
  var el=document.getElementById('moExpEdit');if(el)el.remove();renderPage('expense');
}
function deleteExpense(idx){
  if(!curUser||curUser.role!=='เจ้าของร้าน'){toast('เฉพาะเจ้าของร้าน','err');return}
  var e=DB.expenses[idx];if(!e) return;
  if(!confirm('ลบค่าใช้จ่าย "'+e.name+'" '+thb(e.amount)+' ?')) return;
  DB.expenses.splice(idx,1);
  saveDB();logAction('DELETE_EXPENSE',e.name+' '+thb(e.amount));
  toast('🗑️ ลบค่าใช้จ่ายแล้ว');renderPage('expense');
}

// ═══ IMPROVED BILL — GROUPED BY CATEGORY ═══
function buildBillHTML(o){
  var s=getShopSettings();var bc=s.billConfig||{};var paid=isPaidCheck(o);
  // ═══ Thermal-optimized receipt — ตัวเข้ม อ่านง่าย กระดาษสั้น ═══
  var h='<div style="width:80mm;font-family:Tahoma,Arial,sans-serif;font-size:14px;padding:4px 6px;color:#000;background:#fff;font-weight:700;margin:0 auto;line-height:1.35">';
  // ── Header ──
  var logoH=(bc.logoSize||50);
  if(s.logo&&bc.showLogo!==false) h+='<div style="text-align:center;margin-bottom:4px"><img src="'+s.logo+'" style="height:'+logoH+'px"></div>';
  h+='<div style="text-align:center;font-weight:700;font-size:16px">'+(bc.headerText||s.shopName)+'</div>';
  if(s.address) h+='<div style="text-align:center;font-size:11px">'+s.address+'</div>';
  h+='<div style="text-align:center;font-size:12px">'+fmtPhone(s.phone)+(s.lineOA?' · LINE: '+s.lineOA:'')+'</div>';
  if(bc.taxId) h+='<div style="text-align:center;font-size:11px">TAX ID: '+bc.taxId+'</div>';
  // ── Document type ──
  h+='<div style="border-top:2px dashed #000;margin:4px 0"></div>'+
    '<div style="text-align:center;font-weight:700;font-size:16px">'+(o.type==='cleaning'?(paid?'ใบเสร็จรับเงิน':'ใบรับจองทำความสะอาด'):(paid?'ใบเสร็จรับเงิน':'ใบรับผ้า'))+'</div>'+
    '<div style="text-align:center;font-size:13px;font-weight:700">เลขที่: '+o.id+'</div>'+
    '<div style="text-align:center;margin:1px 0 2px"><svg class="billBarcode" data-val="'+o.id+'" style="max-width:100%;height:auto"></svg></div>'+
    '<div style="text-align:center;font-size:12px">วันที่: '+formatBillDate(o.createdAt)+'</div>'+
    '<div style="font-size:11px">แคชเชียร์: '+o.by+'</div>';
  // ── Customer ──
  h+='<div style="border-top:2px dashed #000;margin:4px 0"></div>'+
    '<div style="font-size:13px;font-weight:700">'+o.mname+' · '+fmtPhone(o.mphone)+'</div>';
  if(o.pickupDate) h+='<div style="font-size:12px;font-weight:700">'+(o.type==='cleaning'?'🧹 วันนัด: ':'📅 วันนัดรับ: ')+fmtISO(o.pickupDate)+(cleanTimeStr(o.cleanTime)?' '+cleanTimeStr(o.cleanTime)+' น.':'')+'</div>';
  h+='<div style="font-size:12px">'+(o.delivery==='delivery'?'🚗 จัดส่ง: '+o.deliveryAddr:o.delivery==='onsite'?'📍 '+o.deliveryAddr:'🏪 รับที่ร้าน')+'</div>';
  // ── Items — grouped by category + compact ──
  h+='<div style="border-top:2px dashed #000;margin:4px 0"></div>';
  h+='<div style="display:flex;font-size:11px;font-weight:700;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:2px"><span style="width:55%;overflow:hidden">รายการ</span><span style="width:15%;text-align:center">จำนวน</span><span style="width:30%;text-align:right">ราคา</span></div>';
  var cats={};
  (o.items||[]).forEach(function(it){var cat=it.c||'อื่นๆ';if(!cats[cat]) cats[cat]=[];cats[cat].push(it)});
  Object.keys(cats).forEach(function(cat,ci){
    var catItem=(o.items||[]).find(function(x){return x.c===cat});
    var catEn=catItem&&catItem.ce?catItem.ce:'';
    h+='<div style="font-weight:700;font-size:12px;margin:'+(ci>0?'4':'1')+'px 0 1px;text-decoration:underline">'+cat+(catEn?' / '+catEn:'')+'</div>';
    cats[cat].forEach(function(it){
      var name=it.t+(it.o?' · '+it.o:'');
      h+='<div style="display:flex;font-size:12px;font-weight:700;padding:1px 0"><span style="width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name+'</span><span style="width:15%;text-align:center">'+it.qty+'</span><span style="width:30%;text-align:right">'+thb(it.p*it.qty)+'</span></div>';
      var en=(it.te||'')+(it.oe?' '+it.oe:'');
      if(en) h+='<div style="font-size:9px;color:#555;padding-left:4px">'+en+'</div>';
    });
  });
  // ── Extras ──
  if(o.extras&&o.extras.length){
    o.extras.forEach(function(e){

  // ── Promo / Note ──
  if(o.promo) h+='<div style="font-size:11px;font-weight:700">🎁 โปร: '+o.promo+'</div>';
  if(o.note) h+='<div style="font-size:11px;font-weight:700;padding:2px 4px;border:1px solid #000;margin:2px 0">📝 '+o.note+'</div>';

// ═══ ERROR BOUNDARY ═══
function initErrorHandler(){
  window.onerror=function(msg,src,line){
    console.error('POS Error:',msg,src,line);
    // กรอง cross-origin "Script error." จาก JSONP (Apps Script) — ไม่ใช่ error จริงของแอป
    if(!msg||msg==='Script error.'||msg==='Script error'||(src&&src.indexOf('script.google')>=0)) return true;
    // กรอง error จาก script tag ที่โหลดจาก external
    if(src&&src.indexOf(location.origin)<0) return true;
    toast('⚠️ Error: '+(msg||'').substring(0,60),'err');
    logAction('ERROR',(msg||'').substring(0,200));
    return false;
  };
  // จับ unhandled promise rejection (เช่น JSONP timeout) แบบเงียบ
  window.addEventListener('unhandledrejection',function(e){
    console.error('Unhandled:',e.reason);
    e.preventDefault();
  });
}

function saveRegQRImage(){

  var s=getShopSettings();

  var w=400,pad=40,qrSize=260;
  var c=document.createElement('canvas');
  c.width=w;c.height=w+80;

  // White background
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  // Shop name
  ctx.fillStyle='#1a2a4a';ctx.font='bold 22px sans-serif';ctx.textAlign='center';

  ctx.strokeStyle='#E5E7EB';ctx.lineWidth=2;
  ctx.strokeRect(qrX-8,qrY-8,qrSize+16,qrSize+16);

let dailyReportTimer=null;
function startDailyReportSchedule(){
  if(dailyReportTimer) clearInterval(dailyReportTimer);
  var s=getShopSettings();
  if(!s.dailyReportTime||!s.dailyReportTo) return;
  dailyReportTimer=setInterval(function(){
    var now=new Date();
    var hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    if(hhmm===s.dailyReportTime){
      var sentKey='dailyReport_'+todayStr();
      if(!localStorage.getItem(sentKey)){
        localStorage.setItem(sentKey,'1');
        sendDailyReport();
      }
    }
  },30000);
}
async function sendDailyReport(){
  var s=getShopSettings();
  var to=s.dailyReportTo||'';
  if(!to){toast('⚠️ ยังไม่ได้ตั้งค่า LINE User ID เจ้าของร้าน','err');return}
  var today=todayStr();
  var allOrders=DB.orders||[];
  var todayOrders=allOrders.filter(function(o){return (o.createdAt||'').includes(today.replace(/-/g,'/').replace(/20/,'25'))||((o.createdAt||'').includes(today))});
  var total=todayOrders.length;
  var revenue=todayOrders.filter(function(o){return isPaidCheck(o)}).reduce(function(s,o){return s+netOf(o)},0);
  var unpaid=todayOrders.filter(function(o){return !isPaidCheck(o)});
  var unpaidAmt=unpaid.reduce(function(s,o){return s+remaining(o)},0);
  // Count by type
  var byType={};todayOrders.forEach(function(o){var t=o.type||'other';byType[t]=(byType[t]||0)+1});
  // Count by status
  var byStatus={};todayOrders.forEach(function(o){var st=o.status||'';byStatus[st]=(byStatus[st]||0)+1});
  // Build message
  var msg='📊 รายงานสรุปประจำวัน\n'+s.shopName+'\n📅 '+formatBillDate(new Date().toISOString())+'\n';
  msg+='═══════════════\n';
  msg+='📋 ออเดอร์วันนี้: '+total+' รายการ\n';
  msg+='💰 รายได้: '+thb(revenue)+'\n';
  if(unpaid.length) msg+='❌ ค้างชำระ: '+unpaid.length+' รายการ ('+thb(unpaidAmt)+')\n';
  else msg+='✅ ไม่มียอดค้างชำระ\n';
  msg+='───────────\n';
  msg+='📦 แยกตามบริการ:\n';
  var typeLabels={laundry:'👕 ซักรีด',bedset:'🛏️ เครื่องนอน',cleaning:'🧹 ทำความสะอาด',weight:'⚖️ ชั่งกิโล',pkg_buy:'📦 ซื้อ Package',quota:'📦 ใช้โควต้า'};
  Object.keys(byType).forEach(function(t){msg+='  '+(typeLabels[t]||t)+': '+byType[t]+' รายการ\n'});
  msg+='───────────\n';
  msg+='📊 แยกตามสถานะ:\n';
  Object.keys(byStatus).forEach(function(st){msg+='  '+st+': '+byStatus[st]+'\n'});
  // Expenses
  var todayExp=(DB.expenses||[]).filter(function(e){return (e.date||'').includes(today.replace(/-/g,'/'))});
  if(todayExp.length){
    var expTotal=todayExp.reduce(function(s,e){return s+(e.amount||0)},0);
    msg+='───────────\n💸 ค่าใช้จ่ายวันนี้: '+todayExp.length+' รายการ ('+thb(expTotal)+')\n';
  }
  // Members
  var newMembers=(DB.members||[]).filter(function(m){return (m.joinDate||'').includes(today.replace(/-/g,'/'))});
  if(newMembers.length) msg+='───────────\n👥 สมาชิกใหม่: '+newMembers.length+' คน\n';
  msg+='═══════════════\n';
  msg+=s.shopName+' · POS Report';

  toast('📊 กำลังส่งรายงานประจำวัน...','info');
  await sendLineMessage(to,[{type:'text',text:msg}],'รายงานรายวัน');
  logAction('DAILY_REPORT','ส่งรายงานประจำวัน');
}
function importRegMember(){
  var code=prompt('วางรหัสนำเข้าจาก LINE:\n(ข้อความที่มี ##REG##...##END##)');
  if(!code) return;
  var match=code.match(/##REG##(.+?)##END##/);
  if(!match){toast('ไม่พบรหัสนำเข้า — ให้วางข้อความทั้งหมดที่ลูกค้าส่งมา','err');return}
  try{
    var data=JSON.parse(decodeURIComponent(escape(atob(match[1]))));
    if(!data.name||!data.phone){toast('ข้อมูลไม่ครบ','err');return}
    var dup=DB.members.find(function(m){return m.phone===data.phone});
    if(dup){toast('เบอร์ '+data.phone+' มีในระบบแล้ว: '+dup.name,'warn');return}
    var welcomePts=getShopSettings().welcomePts||50;
    var m={id:genId('SKN'),name:data.name,nick:data.nick||'',phone:data.phone,
      addrType:data.addrType||'condo',proj:data.proj||'',room:data.room||'',
      village:'',houseNo:'',lineId:data.lineId||'',
      pts:welcomePts,spend:0,level:'ทั่วไป',joinDate:fmtDate(),pdpaConsent:true};
    DB.members.push(m);saveDB();
    logAction('IMPORT_MEMBER',m.id+' '+m.name+' (จาก LINE)');
    toast('นำเข้าสมาชิกสำเร็จ ✅ '+m.name+' ('+m.id+') ได้ '+welcomePts+' แต้ม');
    renderPage('members');
  }catch(e){toast('รหัสไม่ถูกต้อง: '+e.message,'err')}
}

// ═══ ตัดโควต้าส่วนกลาง — ตัดตามหมวดบริการของ item ═══
function deductShopQuota(itemCount,orderType,items){
  var quotas=getShopQuotas();if(!quotas.length) return;
  // รวบรวมหมวดบริการจาก items เพื่อจับคู่กับโควต้า
  var categories=[];
  if(items&&items.length){items.forEach(function(it){if(it.c&&categories.indexOf(it.c)<0) categories.push(it.c)})}
  for(var i=0;i<quotas.length;i++){
    var q=quotas[i];
    if(q.remain<=0||itemCount<=0) continue;
    // จับคู่: "ซักทั่วไป" ตัดทุกบริการ, หรือตรงหมวด/ประเภท
    var match=q.type==='ซักทั่วไป';
    if(!match) categories.forEach(function(cat){if(cat.indexOf(q.type)>=0||q.type.indexOf(cat)>=0) match=true});
    if(!match&&orderType==='bedset'&&q.type==='เครื่องนอน') match=true;
    if(!match&&orderType==='cleaning'&&q.type==='ทำความสะอาด') match=true;
    if(match){
      var deduct=Math.min(itemCount,q.remain);
      q.used+=deduct;q.remain-=deduct;itemCount-=deduct;
      // ═══ บันทึก log ตัดโควต้า ═══
      if(!q.usageLog) q.usageLog=[];
      var catNames=categories.length?categories.join(', '):(orderType||'');
      q.usageLog.push({date:fmtDT(),qty:deduct,cats:catNames,by:curUser?curUser.nick:''});
      if(q.alertAt&&q.remain<=q.alertAt&&q.remain>0) toast('⚠️ โควต้า "'+q.name+'" เหลือ '+q.remain+' ชิ้น กรุณาเติม!','warn');
      else if(q.remain<=0) toast('🔴 โควต้า "'+q.name+'" หมดแล้ว! กรุณาเติมด่วน!','err');
      if(itemCount<=0) break;
    }
  }
}

function bsCalcNet(){

function renderDocsList(docs){
  if(!docs.length) return '<div class="empty-state"><div class="es-text">ยังไม่มีเอกสาร</div></div>';
  return '<table><tr><th>วันที่</th><th>เลขที่</th><th>ประเภท</th><th>ออเดอร์</th><th>ลูกค้า</th><th>ยอด</th><th>โดย</th><th></th></tr>'+
    docs.map(function(d){
      var typeColor=d.docType==='receipt'?'bg-gn':d.docType==='taxinv'?'bg-pr':d.docType==='quotation'?'bg-am':'bg-pp';
      return '<tr><td style="font-size:11px">'+formatBillDate(d.createdAt)+'</td><td><strong>'+d.docNum+'</strong></td><td><span class="badge '+typeColor+'">'+d.typeName+'</span></td><td><code>'+d.orderId+'</code></td><td>'+(d.customer||'-')+'</td><td>'+thb(d.grandTotal)+'</td><td>'+d.by+'</td><td><button class="btn btn-out btn-sm" onclick="reprintDoc(\''+d.orderId+'\',\''+d.docType+'\')">🖨️</button></td></tr>';
    }).join('')+'</table>';
}
function filterDocs(){
  var q=($('docSearch')?$('docSearch').value:'').toLowerCase();
  var tf=$('docTypeFilter')?$('docTypeFilter').value:'';
  var docs=(DB.docHistory||[]).filter(function(d){
    var matchQ=!q||d.docNum.toLowerCase().includes(q)||(d.orderId||'').toLowerCase().includes(q)||(d.customer||'').toLowerCase().includes(q);
    var matchT=!tf||d.docType===tf;
    return matchQ&&matchT;
  }).reverse();
  $('docsListArea').innerHTML=renderDocsList(docs);
}
function reprintDoc(oid,docType){

// ═══ LINE MESSAGING ═══
async function sendLineMessage(userId,messages,logType){
  var apiUrl=getApiUrl();
  if(!apiUrl){toast('⚠️ ตั้งค่า API URL ก่อน','err');return{ok:false}}
  userId=String(userId||'').trim();
  if(!userId||userId.length<30||userId.charAt(0)!=='U'){
    toast('⚠️ LINE User ID ไม่ถูกต้อง: "'+userId.substring(0,20)+'"','err');
    return{ok:false};
  }
  logType=logType||'ข้อความ';
  try{
    var payload=JSON.stringify({to:userId,messages:messages,logType:logType});
    var data=encodeURIComponent(payload);
    // If too large for JSONP, fallback to text
    if(data.length>7000){
      var altText=messages[0]&&messages[0].altText?messages[0].altText:'ข้อความจากร้าน';
      var textMsgs=messages.filter(function(m){return m.type!=='flex'}).concat([{type:'text',text:altText}]);
      // Keep non-flex messages (like QR image) + use altText
      if(messages[0]&&messages[0]._textFallback) textMsgs=[{type:'text',text:messages[0]._textFallback}].concat(messages.filter(function(m){return m.type==='image'}));
      payload=JSON.stringify({to:userId,messages:textMsgs,logType:logType});
      data=encodeURIComponent(payload);
    }
    var result=await new Promise(function(resolve,reject){
      var cbName='_lncb_'+Date.now();
      window[cbName]=function(r){delete window[cbName];resolve(r)};
      var sc=document.createElement('script');
      sc.src=apiUrl+'?action=linePush&callback='+cbName+'&data='+data;
      sc.onerror=function(){delete window[cbName];reject(new Error('Network error'))};
      document.head.appendChild(sc);
      setTimeout(function(){if(window[cbName]){delete window[cbName];reject(new Error('Timeout'))}},15000);
    });
    if(result&&result.ok){toast('📱 ส่ง LINE สำเร็จ ✅');return{ok:true}}
    else{toast('❌ LINE: '+(result.error||'ไม่ทราบสาเหตุ'),'err');return{ok:false}}
  }catch(e){
    toast('❌ ส่ง LINE ล้มเหลว: '+e.message,'err');
    return{ok:false};
  }
}

async function uploadBillToLine(billEl,oid,docNum,docType){
  var o=gO(oid);if(!o) return;
  var m=gM(o.mid);var userId=m?m.lineUserId:'';
  if(!userId){toast('⚠️ ลูกค้ายังไม่มี LINE User ID','warn');return}
  if(!billEl||billEl.offsetHeight===0){toast('⚠️ เปิดบิลก่อน','err');return}
  toast('📸 จับภาพบิล...','info');
  try{
    var canvas=await html2canvas(billEl,{scale:1,useCORS:true,backgroundColor:'#ffffff'});
    if(canvas.width===0){toast('❌ จับภาพไม่ได้','err');return}
    var w=Math.min(1200,canvas.width);var r=w/canvas.width;
    var sm=document.createElement('canvas');sm.width=w;sm.height=Math.round(canvas.height*r);
    sm.getContext('2d').drawImage(canvas,0,0,sm.width,sm.height);
    var base64=sm.toDataURL('image/jpeg',0.75);
    var sizeKB=Math.round(base64.length/1024);
    var apiUrl=getApiUrl();var s=getShopSettings();
    var chunkSize=5000;var uid='i'+Date.now();
    var chunks=[];
    for(var i=0;i<base64.length;i+=chunkSize) chunks.push(base64.substring(i,i+chunkSize));
    toast('📤 อัปโหลด '+sizeKB+'KB ('+chunks.length+' ชิ้น)...','info');
    var finalResult=null;
    for(var c=0;c<chunks.length;c++){
      var isLast=c===chunks.length-1;
      var cd={id:uid,idx:c,chunk:chunks[c],total:chunks.length};
      if(isLast){cd.last=1;cd.fn='SAKKANID_'+(docNum||o.id)}
      var enc=encodeURIComponent(JSON.stringify(cd));
      var res=await new Promise(function(ok,no){
        var cb='_c'+Date.now()+'_'+c;
        window[cb]=function(r){delete window[cb];ok(r)};
        var sc=document.createElement('script');
        sc.src=apiUrl+'?action=uploadChunk&callback='+cb+'&data='+enc;
        sc.onerror=function(){delete window[cb];no(new Error('Chunk '+(c+1)))};
        document.head.appendChild(sc);
        setTimeout(function(){if(window[cb]){delete window[cb];no(new Error('Timeout'))}},15000);
      });
      if(!res||!res.ok){toast('❌ ชิ้นที่ '+(c+1)+' ล้มเหลว','err');return}
      if(isLast) finalResult=res;
    }
    if(finalResult&&finalResult.url){
      toast('📱 กำลังส่ง LINE...','info');
      // ═══ กำหนดชื่อปุ่มตามประเภทบิล ═══
      var btnLabel='📄 เปิดดูบิล';
      var dtLabel='บิล';
      if(docType==='invoice'){btnLabel='📨 เปิดดูใบแจ้งหนี้';dtLabel='ใบแจ้งหนี้'}
      else if(docType==='receipt'){btnLabel='🧾 เปิดดูใบเสร็จรับเงิน';dtLabel='ใบเสร็จรับเงิน'}
      else if(docType==='quotation'){btnLabel='💰 เปิดดูใบเสนอราคา';dtLabel='ใบเสนอราคา'}
      else if(docType==='taxinv'){btnLabel='📋 เปิดดูใบกำกับภาษี';dtLabel='ใบกำกับภาษี'}
      else{
        // บิลปกติ — ดูจาก isPaid
        var isPaidNow=isPaidCheck(o);
        if(o.type==='cleaning'){
          dtLabel=isPaidNow?'ใบเสร็จรับเงิน':'ใบรับจองทำความสะอาด';
          btnLabel=isPaidNow?'🧾 เปิดดูใบเสร็จรับเงิน':'📋 เปิดดูใบรับจอง';
        }else{
          dtLabel=isPaidNow?'ใบเสร็จรับเงิน':'ใบรับผ้า';
          btnLabel=isPaidNow?'🧾 เปิดดูใบเสร็จรับเงิน':'👕 เปิดดูใบรับผ้า';
        }
      }
      var flex={type:'flex',altText:s.shopName+' '+(docNum||o.id)+' '+thb(o.net),contents:{
        type:'bubble',
        header:{type:'box',layout:'vertical',backgroundColor:'#006F98',paddingAll:'12px',contents:[
          {type:'text',text:'📄 เอกสาร',color:'#ffffff',weight:'bold',size:'lg'}
        ]},
        body:{type:'box',layout:'vertical',paddingAll:'12px',contents:[
          {type:'text',text:'📄 '+dtLabel,weight:'bold',size:'sm',color:'#006F98'},
          {type:'text',text:(docNum||o.id),size:'xs',color:'#888888'},
          {type:'text',text:o.mname+' · '+thb(o.net),size:'sm',margin:'sm'},
          {type:'button',action:{type:'uri',label:btnLabel,uri:finalResult.url},style:'primary',color:'#006F98',margin:'lg'}
        ]},
        footer:{type:'box',layout:'vertical',paddingAll:'8px',contents:[
          {type:'text',text:'ขอบคุณที่ใช้บริการค่ะ Thank you.',size:'xxs',color:'#aaaaaa',align:'center'}
        ]}
      }};
      var msgs=[flex];
      await sendLineMessage(userId,msgs,'ส่งรูปบิล');
      logAction('SEND_IMG_LINE',(docNum||o.id));
    }else{toast('❌ ไม่ได้ URL','err')}
  }catch(e){toast('❌ '+e.message,'err')}
}

async function sendFlexBill(userId,o,s,docNum){
  var paid=isPaidCheck(o);
  var cats={};
  (o.items||[]).forEach(function(it){var cat=it.c||'อื่นๆ';if(!cats[cat])cats[cat]={ce:it.ce||'',items:[]};cats[cat].items.push(it)});
  var itemEls=[];
  Object.keys(cats).forEach(function(cat){
    var ce=cats[cat].ce;
    itemEls.push({type:'text',text:'▸ '+cat+(ce?' / '+ce:''),size:'xxs',color:'#006F98',weight:'bold',margin:'sm'});
    cats[cat].items.forEach(function(it){
      var thName=(it.t||'')+(it.o?' '+it.o:'');
      var enName=(it.te||'')+(it.oe?' '+it.oe:'');
      itemEls.push({type:'box',layout:'horizontal',margin:'xs',contents:[
        {type:'text',text:'  '+thName,size:'xxs',color:'#555555',flex:5},
        {type:'text',text:'x'+it.qty,size:'xxs',color:'#888888',flex:1,align:'center'},
        {type:'text',text:thb(it.p*it.qty),size:'xxs',color:'#111111',flex:2,align:'end'}
      ]});
      if(enName.trim()) itemEls.push({type:'text',text:'  '+enName,size:'xxs',color:'#aaaaaa'});
    });
  });
  // Extras
  if(o.extras&&o.extras.length) o.extras.forEach(function(ex){
    itemEls.push({type:'box',layout:'horizontal',margin:'xs',contents:[
      {type:'text',text:'+ '+ex.name,size:'xxs',color:'#555555',flex:6},
      {type:'text',text:thb(ex.price),size:'xxs',color:'#111111',flex:2,align:'end'}
    ]});
  });
  if(o.delCost>0) itemEls.push({type:'box',layout:'horizontal',margin:'xs',contents:[
    {type:'text',text:'🚗 ค่าจัดส่ง Delivery',size:'xxs',color:'#555555',flex:6},
    {type:'text',text:thb(o.delCost),size:'xxs',color:'#111111',flex:2,align:'end'}
  ]});
  var stColor=paid?'#1D9E75':o.status.includes('พร้อม')?'#1D9E75':o.status.includes('ซัก')?'#D97706':'#006F98';
  var bodyC=[
    {type:'box',layout:'horizontal',contents:[
      {type:'text',text:docNum||o.id,weight:'bold',size:'sm',color:'#006F98',flex:3},
      {type:'text',text:formatBillDate(o.createdAt),size:'xxs',color:'#999999',flex:3,align:'end'}
    ]},
    {type:'text',text:o.mname,size:'sm',color:'#333333',margin:'xs'},
    {type:'text',text:o.status,size:'xxs',color:stColor,weight:'bold'},
    {type:'separator',margin:'md'}

// ══ จับคู่ลัด: รวม LINE ของ "LINE Friend" (lead) เข้ากับสมาชิกเดิม แล้วลบ lead ทิ้ง ══
function mergeLineIntoMember(targetId,leadId){
  var t=gM(targetId),l=gM(leadId);
  if(!t||!l){toast('ไม่พบสมาชิก','err');return}
  if(t.id===l.id){toast('เป็นคนเดียวกัน','err');return}
  // ย้ายข้อมูล LINE จาก lead → สมาชิกเดิม
  if(l.lineUserId) t.lineUserId=l.lineUserId;
  if(l.lineName) t.lineName=l.lineName;
  if(l.lineId&&!t.lineId) t.lineId=l.lineId;
  if(l.lang&&!t.lang) t.lang=l.lang;
  // รวมแต้ม/ยอดที่ lead อาจมี (ปกติ 0)
  t.pts=(parseInt(t.pts)||0)+(parseInt(l.pts)||0);
  t.spend=(parseFloat(t.spend)||0)+(parseFloat(l.spend)||0);
  // ย้ายออเดอร์/โควต้าที่เคยผูกกับ lead มาที่สมาชิกเดิม
  (DB.orders||[]).forEach(function(o){if(o.mid===l.id){o.mid=t.id;o.mname=t.name}});
  (DB.quotas||[]).forEach(function(q){if(q.mid===l.id)q.mid=t.id});
  // ลบ lead ออก
  DB.members=(DB.members||[]).filter(function(m){return m.id!==l.id});
  saveDB();
  if(getApiUrl()&&typeof syncPushAll==='function'&&curUser) syncPushAll(true);
  logAction('MERGE_LINE',t.id+' ← '+l.id+' ('+(l.lineName||l.name)+')');
  var mo=document.getElementById('moLinePair');if(mo)mo.remove();
  closeMo('moDetail');
  toast('✅ จับคู่ LINE ของ "'+(l.lineName||l.name)+'" เข้ากับ '+t.name+' แล้ว 🎉');
  if(curPage==='members') renderPage('members');
}

// ═══ GOOGLE SHEETS SYNC ═══
function getApiUrl(){var s=getShopSettings();return s.apiUrl||''}
function getLineToken(){var s=getShopSettings();return s.lineChannelToken||''}
let syncStatus='idle';
let lastSyncTime=null;

async function apiCall(action,sheet,body){
  syncStatus='syncing';updSyncUI();
  try{
    var data;
    if(body&&Object.keys(body).length){
      // WRITE: POST with no-cors (fire-and-forget, then verify with GET)
      var url=getApiUrl()+'?action='+action+(sheet?'&sheet='+sheet:'');
      await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(body)});
      data={ok:true,note:'sent'};
    }else{
      // READ: JSONP via script tag (bypasses CORS completely)
      data=await jsonpCall(action,sheet);
    }
    syncStatus=data.ok?'success':'error';
    if(data.ok) lastSyncTime=new Date();
    updSyncUI();return data;
  }catch(err){
    syncStatus='error';updSyncUI();
    return {ok:false,error:err.message};
  }
}

// JSONP: inject <script> tag to bypass CORS
function jsonpCall(action,sheet){
  return new Promise(function(resolve,reject){
    var cbName='_skcb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    var s=null;
    var timeout=setTimeout(function(){
      delete window[cbName];if(s&&s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('Timeout'));
    },30000);
    window[cbName]=function(data){
      clearTimeout(timeout);delete window[cbName];
      if(s&&s.parentNode)s.parentNode.removeChild(s);
      resolve(data);
    };
    var url=getApiUrl()+'?action='+action+(sheet?'&sheet='+sheet:'')+'&callback='+cbName;
    // ป้องกัน URL ยาวเกิน (JSONP cap ~8KB)
    if(url.length>8000){clearTimeout(timeout);delete window[cbName];reject(new Error('URL too long'));return}
    s=document.createElement('script');
    s.src=url;
    s.onerror=function(){clearTimeout(timeout);delete window[cbName];if(s&&s.parentNode)s.parentNode.removeChild(s);reject(new Error('เชื่อมต่อไม่ได้'))};
    document.head.appendChild(s);
  });
}

// ── Push all data to Sheets (per-sheet) ──
async function syncPushAll(silent){
  var apiUrl=getApiUrl();
  if(!apiUrl){if(!silent)toast('⚠️ ยังไม่ได้ตั้งค่า API URL — ไปที่ ⚙️ ตั้งค่า → 🔗 การเชื่อมต่อ','err');return}
  syncStatus='syncing';updSyncUI();
  if(!silent)toast('📤 กำลัง sync ขึ้น Cloud (15 sheets)...','info');
  var allOrders=DB.orders||[];
  var sheets={
    orders:allOrders,
    orders_laundry:allOrders.filter(function(o){return o.type==='laundry'}),
    orders_package:allOrders.filter(function(o){return o.type==='pkg_buy'||o.type==='quota'}),
    orders_bedset:allOrders.filter(function(o){return o.type==='bedset'}),
    orders_cleaning:allOrders.filter(function(o){return o.type==='cleaning'}),
    members:DB.members||[],
    quotas:(DB.quotas||[]).map(function(q){var m=gM(q.mid);return{id:q.id,mid:q.mid,mname:m?m.name:'',pkgName:q.pkgName,pkgType:q.pkgType,total:q.total,used:q.used,remain:q.remain,buyDate:q.buyDate,exp:q.exp}}),
    promos:DB.promos||[],
    expenses:DB.expenses||[],
    shifts:DB.shifts||[],
    pricelist:CAT.map(function(it){return{c:it.c,ce:it.ce||'',t:it.t,te:it.te||'',o:it.o||'',oe:it.oe||'',p:it.p,k:it.k,pt:it.pt||'fixed',sku:it.sku||''}}),
    bed_sets:BED_SETS.map(function(b){return{size:b.size,label:b.label,labelEn:b.labelEn||'',price:b.price,cost:b.cost,items:JSON.stringify(b.items)}}),
    cln_svcs:CLN_SVCS.map(function(s){return{type:s.type,label:s.label,labelEn:s.labelEn||'',minPrice:s.minPrice,cost:s.cost}}),
    packages:PKGS.map(function(p){return{type:p.type,typeEn:p.typeEn||'',qty:p.qty,price:p.price,cost:p.cost,expDays:p.expDays}}),
    settings:Object.keys(getShopSettings()).map(function(k){var v=getShopSettings()[k];return{key:k,value:typeof v==='object'?JSON.stringify(v):String(v)}})
  };
  var success=0;
  for(var name in sheets){
    if(sheets[name].length){
      try{
        var url=apiUrl+'?action=replaceAll&sheet='+name;
        await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify({rows:sheets[name]})});
        success++;
      }catch(e){console.error('Push '+name+' failed:',e)}
    }
  }
  syncStatus='success';lastSyncTime=new Date();updSyncUI();
  if(!silent)toast('✅ Sync สำเร็จ! ('+success+'/15 sheets)');
  logAction('SYNC_PUSH','Push to Google Sheets (15 sheets)');

// ── เติม/อัปเดตชื่อ LINE ให้สมาชิกจากชีต line_users (webhook เก็บ displayName ไว้เสมอ) ──
async function backfillLineNamesFromCloud(){
  try{
    if(!getApiUrl())return false;
    var lu=await jsonpCall('getLineUsers','');
    if(!lu||!lu.ok||!lu.data||!lu.data.length)return false;
    var map={};lu.data.forEach(function(u){var id=String(u.userId||'').trim();if(id&&u.displayName)map[id]=u.displayName});
    var changed=false;
    (DB.members||[]).forEach(function(m){
      var uid=String(m.lineUserId||'').trim();
      if(uid&&map[uid]&&map[uid]!==m.lineName){m.lineName=map[uid];changed=true}
    });
    if(changed){saveDB();if(curPage==='members')renderPage('members')}
    return changed;
  }catch(e){return false}
}
// ── Pull all data from Sheets ──
async function syncPullAll(){
  toast('📥 กำลังดึงข้อมูลจาก Cloud...','info');
  try{
    var result=await jsonpCall('getFullDB','');
    if(result.ok&&result.data){
    var d=result.data;
    // Merge data
    if(d.orders&&d.orders.length){DB.orders=d.orders.map(fixOrder)}
    if(d.members&&d.members.length){DB.members=d.members.filter(function(m){return !isDeletedMember(m.id)})}
    if(d.quotas&&d.quotas.length){DB.quotas=d.quotas}
    if(d.promos&&d.promos.length){DB.promos=d.promos}
    if(d.expenses&&d.expenses.length){DB.expenses=d.expenses}
    if(d.shifts&&d.shifts.length){DB.shifts=d.shifts}
    // Update pricelist
    if(d.pricelist&&d.pricelist.length){
      CAT.length=0;
      d.pricelist.forEach(function(it){CAT.push({c:it.c,ce:it.ce||'',t:it.t,te:it.te||'',o:it.o||'',oe:it.oe||'',p:Number(it.p)||0,k:Number(it.k)||0,pt:it.pt||'fixed',sku:it.sku||''})});
      CATS_UNIQUE.length=0;[...new Set(CAT.map(function(x){return x.c}))].forEach(function(c){CATS_UNIQUE.push(c)});
    }
    // Update BED_SETS from bed_sets sheet
    if(d.bed_sets&&d.bed_sets.length){
      BED_SETS.length=0;
      d.bed_sets.forEach(function(b){var items=b.items;if(typeof items==='string'){try{items=JSON.parse(items)}catch(e){items=[]}}BED_SETS.push({size:b.size,label:b.label,labelEn:b.labelEn||'',price:Number(b.price)||0,cost:Number(b.cost)||0,items:items||[]})});
    }
    // Update CLN_SVCS from cln_svcs sheet
    if(d.cln_svcs&&d.cln_svcs.length){
      CLN_SVCS.length=0;
      d.cln_svcs.forEach(function(s){CLN_SVCS.push({type:s.type,label:s.label,labelEn:s.labelEn||'',minPrice:Number(s.minPrice)||0,cost:Number(s.cost)||0})});
    }
    // Update PKGS from packages sheet
    if(d.packages&&d.packages.length){
      PKGS.length=0;
      d.packages.forEach(function(p){PKGS.push({type:p.type,typeEn:p.typeEn||'',qty:Number(p.qty)||0,price:Number(p.price)||0,cost:Number(p.cost)||0,expDays:Number(p.expDays)||90})});
    }
    // Restore settings (ข้ามถ้าเพิ่งแก้ในเครื่อง <60วิ — POS เป็นตัวหลัก)
    if(d.settings&&d.settings.length&&new Date().getTime()>(window._settingsDirtyUntil||0)){
      d.settings.forEach(function(s){
        if(s.key&&s.value!==undefined){
          try{DB.shopSettings[s.key]=JSON.parse(s.value)}catch(e){DB.shopSettings[s.key]=s.value}
        }
      });
    }
    saveDB();
    backfillLineNamesFromCloud(); // เติมชื่อ LINE ให้สมาชิกที่มี UID แต่ยังไม่มีชื่อ
    toast('✅ ดึงข้อมูลจาก Cloud สำเร็จ!');
    logAction('SYNC_PULL','Pull all data from Google Sheets');
    renderPage(curPage);
  }else{
    toast('❌ ดึงข้อมูลล้มเหลว: '+(result.error||''),'err');
  }
  return result;
  }catch(err){toast('❌ ดึงข้อมูลล้มเหลว: '+err.message,'err');return{ok:false}}
}

// ── Fix order data types from Sheets ──
function fixOrder(o){
  if(typeof o.items==='string'){try{o.items=JSON.parse(o.items)}catch(e){o.items=[]}}
  if(typeof o.extras==='string'){try{o.extras=JSON.parse(o.extras)}catch(e){o.extras=[]}}
  if(typeof o.payHist==='string'){try{o.payHist=JSON.parse(o.payHist)}catch(e){o.payHist=[]}}
  o.net=Number(o.net)||0;o.disc=Number(o.disc)||0;o.cost=Number(o.cost)||0;
  o.delCost=Number(o.delCost)||0;o.pts=Number(o.pts)||0;
  o.isPaid=o.isPaid===true||o.isPaid==='true';
  return o;
}

function registerPWA(){

    // สร้าง minimal service worker inline
    var swCode='self.addEventListener("install",function(e){self.skipWaiting()});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request)}))})';
    var blob=new Blob([swCode],{type:'application/javascript'});

  }
  // Manifest
  var manifest={name:'SAKKANID POS',short_name:'SAKKANID',start_url:location.href.split('?')[0],display:'standalone',background_color:'#ffffff',theme_color:'#006F98',icons:[{src:getShopSettings().logo||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">🫧</text></svg>',sizes:'192x192',type:'image/png'}]};

function scanGarmentQR(){
  if(!('BarcodeDetector' in window)){
    // Fallback: ใช้ camera + prompt
    var code=prompt('กรอกเลขออเดอร์จากป้ายผ้า:');
    if(code){var o=gO(code);if(o){showOrderDetail(code)}else{toast('ไม่พบออเดอร์ '+code,'err')}}
    return;
  }
  // ใช้ BarcodeDetector API
  var video=document.createElement('video');
  video.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;object-fit:cover';
  var closeBtn=document.createElement('button');
  closeBtn.textContent='✕ ปิดกล้อง';closeBtn.className='btn btn-rd';
  closeBtn.style.cssText='position:fixed;top:20px;right:20px;z-index:10000';
  closeBtn.onclick=function(){video.srcObject.getTracks().forEach(function(t){t.stop()});video.remove();closeBtn.remove()};
  document.body.appendChild(video);document.body.appendChild(closeBtn);
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
    video.srcObject=stream;video.play();
    var detector=new BarcodeDetector({formats:['qr_code']});
    var scanInterval=setInterval(function(){
      detector.detect(video).then(function(codes){
        if(codes.length){
          clearInterval(scanInterval);
          var code=codes[0].rawValue;
          video.srcObject.getTracks().forEach(function(t){t.stop()});video.remove();closeBtn.remove();
          var o=gO(code);if(o){showOrderDetail(code);toast('✅ พบออเดอร์ '+code)}else{toast('ไม่พบ '+code,'err')}
        }
      }).catch(function(){});
    },500);
  }).catch(function(){toast('ไม่สามารถเปิดกล้องได้','err');video.remove();closeBtn.remove()});
}

async function calcDeliveryByDistance(destAddr){
  var addr=destAddr||prompt('กรอกที่อยู่ปลายทาง:');if(!addr) return;
  var s=getShopSettings();var shopAddr=s.address||'กรุงเทพฯ';
  var apiKey=s.googleMapsKey||'';
  if(!apiKey){toast('ไม่มี Google Maps API Key','warn');return calcDeliveryByZone(addr)}
  var apiUrl=getApiUrl();
  if(!apiUrl){toast('⚠️ ต้องตั้งค่า API URL (Apps Script) ก่อน','err');return}
  toast('📍 กำลังคำนวณระยะทาง...','info');
  try{
    // เรียกผ่าน Apps Script (server-side) เพื่อเลี่ยง CORS
    var payload=encodeURIComponent(JSON.stringify({origin:shopAddr,dest:addr,key:apiKey}));
    var result=await new Promise(function(resolve,reject){
      var cbName='_mapcb_'+Date.now();
      window[cbName]=function(r){delete window[cbName];resolve(r)};
      var sc=document.createElement('script');
      sc.src=apiUrl+'?action=calcDistance&callback='+cbName+'&data='+payload;
      sc.onerror=function(){delete window[cbName];reject(new Error('เชื่อมต่อไม่ได้'))};
      document.head.appendChild(sc);
      setTimeout(function(){if(window[cbName]){delete window[cbName];reject(new Error('Timeout'))}},15000);
    });
    if(result&&result.ok&&result.km!=null){
      var cost=calcDeliveryCostByKm(result.km);
      var el=$('mapsTestResult');
      if(el) el.innerHTML='<div style="color:var(--gn);font-weight:600">✅ ระยะทาง '+result.km.toFixed(1)+' km'+(result.duration?' ('+result.duration+')':'')+'<br>💰 ค่าส่ง '+thb(cost)+'</div>';
      toast('📍 '+result.km.toFixed(1)+' km · ค่าส่ง '+thb(cost));
      return {km:result.km,duration:result.duration,cost:cost};
    }else{
      var msg=result&&result.error?result.error:'ไม่พบเส้นทาง';
      var el2=$('mapsTestResult');if(el2) el2.innerHTML='<span style="color:var(--rd)">❌ '+msg+'</span>';
      toast('❌ '+msg,'err');
    }
  }catch(e){
    var el3=$('mapsTestResult');if(el3) el3.innerHTML='<span style="color:var(--rd)">❌ '+e.message+'</span>';
    toast('❌ '+e.message,'err');
  }
}
function calcDeliveryCostByKm(km){
  var s=getShopSettings();var tiers=s.deliveryKmTiers||[{maxKm:3,price:30},{maxKm:5,price:50},{maxKm:10,price:80},{maxKm:20,price:120}];
  tiers.sort(function(a,b){return a.maxKm-b.maxKm});
  for(var i=0;i<tiers.length;i++){if(km<=tiers[i].maxKm) return tiers[i].price}
  return tiers.length?tiers[tiers.length-1].price:100;
}
function calcDeliveryByZone(addr){
  var s=getShopSettings();var zones=s.deliveryZones||[];
  for(var i=0;i<zones.length;i++){if(addr.includes(zones[i].name)) return zones[i].price}
  toast('ไม่พบ zone — ใช้ค่าเริ่มต้น','warn');
  return s.defaultDeliveryCost||50;
}
