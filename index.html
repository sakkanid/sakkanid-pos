<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAKKANID Laundry POS</title>
<link rel="manifest" href="data:application/json,{}">
<meta name="theme-color" content="#006F98">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
--pr:#006F98;--prl:#D9F0FB;--pr2:#1ABBEF;--pr2l:#C5EDFB;
--gn:#0D8A6A;--gnl:#E0F5EF;--gnd:#076B52;
--am:#C4820A;--aml:#FEF3C7;--rd:#C92A2A;--rdl:#FEE2E2;
--pp:#5B5FD6;--ppl:#EEEEFF;
--bg:#F0F3F5;--wh:#FFFFFF;--b1:#DDE1E5;--b2:#C8CDD3;
--t1:#1A2A3A;--t2:#344250;--t3:#6B7A88;
--ff:'IBM Plex Sans Thai',sans-serif;--fm:'IBM Plex Mono',monospace;
--r:10px;--sh:0 2px 14px rgba(0,80,130,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh}
/* ═══ LOGIN ═══ */
#lockScreen{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#004E6B,#006F98 35%,#1ABBEF 70%,#7FD2FD 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px}
.login-card{display:flex;background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:800px;width:100%;max-height:92vh}
.login-left{flex:1;background:linear-gradient(160deg,#F4F9FB,#E3F2FA);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;position:relative}
.login-mascot{width:100%;max-width:300px;height:auto}
.login-tagline{color:#006F98;font-weight:700;font-size:17px;margin-top:12px;letter-spacing:.5px}
.login-right{flex:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 32px;text-align:center;overflow-y:auto}
@media(max-width:720px){.login-card{flex-direction:column;min-height:auto;max-width:420px}.login-left{padding:28px 20px}.login-mascot{max-width:180px}.login-right{padding:28px 20px}}
.lock-logo{font-size:32px;font-weight:800;margin-bottom:4px;text-shadow:0 4px 30px rgba(0,0,0,.25);letter-spacing:-.5px}
.lock-sub{opacity:.85;font-size:13px;margin-bottom:16px;font-weight:500;letter-spacing:2px}
.user-grid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.user-btn{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.25);border-radius:16px;padding:18px 24px;color:#fff;cursor:pointer;text-align:center;min-width:130px;transition:.25s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.user-btn:hover,.user-btn.sel{background:rgba(255,255,255,.28);border-color:#fff;transform:translateY(-4px) scale(1.03);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.user-btn .ub-name{font-weight:700;font-size:14px;margin-bottom:2px}.user-btn .ub-role{font-size:11px;opacity:.75}
.pin-area{text-align:center}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:.2s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.pin-key{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;height:52px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:.15s;font-family:var(--fm)}
.pin-key:hover{background:rgba(255,255,255,.25)}
.pin-key:active{transform:scale(.95)}
.pin-key.del{font-size:14px;font-weight:600}
.pin-msg{margin-top:14px;font-size:13px;min-height:20px}
/* ═══ APP SHELL ═══ */
#app{display:none;height:100vh;overflow:hidden}
.app-wrap{display:flex;height:100vh}
/* SIDEBAR */
.sidebar{width:220px;background:#003D55;color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-logo{padding:16px 18px;font-size:20px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sb-logo span{font-size:24px}
.sb-nav{flex:1;padding:8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.7);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;margin-bottom:2px}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-item.act{background:var(--pr);color:#fff;font-weight:700}
.sb-item .sb-icon{font-size:16px;width:22px;text-align:center}
.sb-item .sb-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.sb-section{padding:6px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35);margin-top:10px;font-weight:700}
.sb-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:11px}
.sb-footer .sf-name{font-weight:600;color:rgba(255,255,255,.8)}.sb-footer .sf-role{color:rgba(255,255,255,.4);font-size:10px}
.sb-logout{margin-top:6px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--ff);width:100%}
.sb-logout:hover{background:rgba(255,255,255,.2);color:#fff}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--wh);padding:12px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b1);flex-shrink:0}
.topbar-title{font-size:18px;font-weight:700;color:var(--t1)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 24px}
/* ── Kanban board: เลื่อนแนวนอนดูครบทุกคอลัมน์ + แถบเลื่อนเห็นชัด ── */
.kanban-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.kanban-scroll::-webkit-scrollbar{height:14px}
.kanban-scroll::-webkit-scrollbar-thumb{background:var(--pr);border-radius:7px;border:2px solid var(--prl,#e5eef3)}
.kanban-scroll::-webkit-scrollbar-thumb:hover{background:#005579}
.kanban-scroll::-webkit-scrollbar-track{background:var(--prl,#e5eef3);border-radius:6px}
.kanban-row{display:flex;gap:10px;width:max-content;align-items:flex-start}
.kanban-col{flex:0 0 250px;width:250px;background:var(--bg);border-radius:12px;padding:8px;align-self:stretch}
/* ═══ COMPONENTS ═══ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-family:var(--ff);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn-pr{background:var(--pr);color:#fff}.btn-gn{background:var(--gn);color:#fff}
.btn-am{background:var(--am);color:#fff}.btn-rd{background:var(--rd);color:#fff}
.btn-out{background:var(--wh);color:var(--pr);border:1.5px solid var(--pr)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-lg{padding:10px 24px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bg-pr{background:var(--prl);color:var(--pr)}.bg-gn{background:var(--gnl);color:var(--gnd)}
.bg-am{background:var(--aml);color:var(--am)}.bg-rd{background:var(--rdl);color:var(--rd)}
.bg-pp{background:var(--ppl);color:var(--pp)}.bg-gr{background:#F3F4F6;color:var(--t3)}
input,select,textarea{font-family:var(--ff);font-size:13px;padding:8px 12px;border:1.5px solid var(--b1);border-radius:8px;outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prl)}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:4px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);color:var(--t3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--b1);font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--b1);color:var(--t2);vertical-align:top}
tr:last-child td{border-bottom:none}
.kpi{background:linear-gradient(135deg,var(--prl),var(--wh));border:1px solid #B8E2F7;border-radius:var(--r);padding:14px;text-align:center}
.kpi-val{font-size:24px;font-weight:700;color:var(--pr);font-family:var(--fm)}.kpi-lbl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase}
/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--wh);border-radius:14px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-lg{max-width:800px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;position:sticky;top:0;background:var(--wh);z-index:1;border-radius:14px 14px 0 0}
.modal-head h3{font-size:16px;font-weight:700;flex:1}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t3);padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--b1);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--wh);border-radius:0 0 14px 14px}
/* ═══ TOAST ═══ */
#toastBox{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;animation:fadeIn .3s;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast-ok{background:var(--gn)}.toast-err{background:var(--rd)}.toast-warn{background:var(--am)}.toast-info{background:var(--pr)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* ═══ ORDER CARD ═══ */
.o-card{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--pr)}
.svc-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.svc-card{background:var(--wh);border:2px solid var(--b1);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px}
.svc-card:hover{border-color:var(--pr2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,111,152,.12)}
.svc-card.sel{border-color:var(--pr);background:var(--prl);box-shadow:0 4px 12px rgba(0,111,152,.2)}
.svc-card .svc-icon{font-size:30px;margin-bottom:6px;line-height:1}
.svc-card .svc-name{font-size:13px;font-weight:600;color:var(--t1);line-height:1.3}
@media(max-width:600px){.svc-card-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.svc-card{padding:12px 6px;min-height:72px}.svc-card .svc-icon{font-size:26px}.svc-card .svc-name{font-size:12px}}
.o-card.st-wash{border-left-color:var(--am)}.o-card.st-ready{border-left-color:var(--gn)}.o-card.st-ship{border-left-color:var(--pp)}.o-card.st-done{border-left-color:var(--b2)}.o-card.st-cancel{border-left-color:var(--rd)}
.o-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.o-id{font-family:var(--fm);font-weight:700;font-size:13px;color:var(--pr)}
.o-type{font-size:11px}.o-date{margin-left:auto;font-size:11px;color:var(--t3)}
.o-cust{font-size:13px;font-weight:600;margin-bottom:4px}.o-info{font-size:12px;color:var(--t3)}
.o-total{font-family:var(--fm);font-weight:700;font-size:15px;color:var(--t1);margin-top:6px}
.o-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* ═══ STATUS FILTER ═══ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--b1);background:var(--wh);color:var(--t3);transition:.15s}
.filter-chip:hover{border-color:var(--pr);color:var(--pr)}
.filter-chip.act{background:var(--pr);color:#fff;border-color:var(--pr)}
/* ═══ PRINT ═══ */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:72mm;font-size:13px;font-weight:700;color:#000!important;line-height:1.3;font-family:Tahoma,Arial,sans-serif}#printArea *{color:#000!important}#printArea.print-a4{width:190mm;font-size:13px;font-weight:600}#printArea.print-a5{width:138mm;font-size:11px;font-weight:600}@page{margin:2mm}}
@media print{#printArea:not(.print-a4):not(.print-a5){width:72mm}}
.print-a4-page{}
/* ═══ RESPONSIVE ═══ */
@media(max-width:768px){
.sidebar{position:fixed;left:-260px;z-index:999;transition:.3s;width:260px;height:100vh}
.sidebar.open{left:0}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:998}
.sb-overlay.show{display:block}
.topbar .menu-btn{display:flex}
.g2,.g3,.g4{grid-template-columns:1fr}
.content{padding:14px}
}
@media(min-width:769px){.topbar .menu-btn{display:none}}
.menu-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t2);padding:4px}
/* STATUS COLORS */
.st-tag{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.st-tag.s-new{background:var(--prl);color:var(--pr)}.st-tag.s-wash{background:var(--aml);color:var(--am)}
.st-tag.s-ready{background:var(--gnl);color:var(--gnd)}.st-tag.s-ship{background:var(--ppl);color:var(--pp)}
.st-tag.s-done{background:var(--bg);color:var(--t3)}.st-tag.s-cancel{background:var(--rdl);color:var(--rd)}
.st-tag.s-book{background:#D9F0FB;color:#006F98}.st-tag.s-work{background:var(--rdl);color:var(--rd)}
.st-tag.s-unpaid{background:var(--rdl);color:var(--rd)}
.empty-state{text-align:center;padding:40px;color:var(--t3)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}.empty-state .es-text{font-size:14px}
/* ═══ DARK MODE ═══ */
body.dark{--bg:#0F1419;--wh:#1A2332;--b1:#2A3A4A;--b2:#3A4A5A;--t1:#E8EDF2;--t2:#B0BEC5;--t3:#78909C;--sh:0 2px 14px rgba(0,0,0,.3)}
body.dark .sidebar{background:#0A1929}
body.dark #lockScreen{background:linear-gradient(135deg,#0A1929,#003D55 35%,#005577 70%,#006F98 100%)}
body.dark .topbar{background:#1A2332;border-color:#2A3A4A}
body.dark .kpi{background:linear-gradient(135deg,#1A2838,#1A2332);border-color:#2A3A4A}
body.dark th{background:#151F2E}
body.dark input,body.dark select,body.dark textarea{background:#1A2332;border-color:#2A3A4A;color:#E8EDF2}
body.dark .modal{background:#1A2332}
body.dark .modal-head,.dark .modal-foot{background:#1A2332;border-color:#2A3A4A}
body.dark .filter-chip{background:#1A2332;border-color:#2A3A4A;color:#78909C}
body.dark .o-card{background:#1A2332}
body.dark .btn-out{background:#1A2332;color:var(--pr);border-color:#2A3A4A}
body.dark .tab{color:#78909C}body.dark .tab.act{background:#1A2332}
.search-box{position:relative}.search-box input{padding-left:36px}
select{-webkit-appearance:menulist;appearance:menulist;min-height:44px;font-size:14px!important}
input[type="date"],input[type="time"],input[type="number"]{min-height:44px;font-size:14px!important}
.search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t3);transition:.15s}
.tab.act{background:var(--wh);color:var(--pr);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.paid-box{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;margin-top:8px}
.paid-box.yes{background:var(--gnl);color:var(--gnd)}.paid-box.no{background:var(--rdl);color:var(--rd)}
</style>
</head>
<body>

<!-- ═══ TOAST ═══ -->
<div id="toastBox"></div>

<!-- ═══ PRINT AREA ═══ -->
<div id="printArea" style="display:none"></div>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="lockScreen">
  <div class="login-card">
    <div class="login-left">
      <svg viewBox="0 0 320 320" class="login-mascot" xmlns="http://www.w3.org/2000/svg">
        <!-- ฟองสบู่ตกแต่ง -->
        <circle cx="55" cy="60" r="14" fill="#7FD2FD" opacity=".5"/>
        <circle cx="270" cy="80" r="10" fill="#1ABBEF" opacity=".4"/>
        <circle cx="285" cy="230" r="16" fill="#7FD2FD" opacity=".45"/>
        <circle cx="45" cy="250" r="11" fill="#1ABBEF" opacity=".4"/>
        <!-- ตะกร้าผ้า -->
        <ellipse cx="160" cy="285" rx="80" ry="14" fill="#004E6B" opacity=".12"/>
        <path d="M105 175 L215 175 L205 265 Q204 275 194 275 L126 275 Q116 275 115 265 Z" fill="#fff" stroke="#006F98" stroke-width="4"/>
        <line x1="120" y1="195" x2="128" y2="258" stroke="#C5EDFB" stroke-width="3"/>
        <line x1="145" y1="195" x2="149" y2="258" stroke="#C5EDFB" stroke-width="3"/>
        <line x1="170" y1="195" x2="170" y2="258" stroke="#C5EDFB" stroke-width="3"/>
        <line x1="195" y1="195" x2="191" y2="258" stroke="#C5EDFB" stroke-width="3"/>
        <line x1="215" y1="200" x2="105" y2="200" stroke="#006F98" stroke-width="4"/>
        <!-- เสื้อผ้าในตะกร้า -->
        <path d="M125 178 Q140 155 160 165 Q180 155 195 178 Z" fill="#1ABBEF" opacity=".85"/>
        <path d="M135 172 Q155 150 175 172" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <!-- ไม้แขวนเสื้อ (โลโก้ร้าน) -->

const $=id=>document.getElementById(id);
function genId(prefix){
  const key=prefix==='LDR'||prefix==='BED'||prefix==='CLN'||prefix==='PKB'||prefix==='KG'?'orderSeq':prefix==='SKN'?'memberSeq':'quotaSeq';
  // กัน ID ซ้ำ: หาเลขสูงสุดที่มีอยู่จริง (เผื่อ counter ตามข้อมูลจาก Cloud/webhook ไม่ทัน)
  var maxExisting=0,id,n;
  if(key==='orderSeq'){
    (DB.orders||[]).forEach(function(o){id=String(o&&o.id||'');n=parseInt(id.replace(/^[A-Za-z]+-/,''),10)||0;if(n>maxExisting)maxExisting=n});
  }else if(key==='memberSeq'){
    (DB.members||[]).forEach(function(m){id=String(m&&m.id||'');if(id.indexOf('SKN-')===0){n=parseInt(id.slice(4),10)||0;if(n>maxExisting)maxExisting=n}});
  }else{
    [].concat(DB.quotas||[],DB.expenses||[],DB.orders||[]).forEach(function(x){id=String(x&&x.id||'');if(id.indexOf(prefix+'-')===0){n=parseInt(id.slice(prefix.length+1),10)||0;if(n>maxExisting)maxExisting=n}});
  }
  var next=Math.max((DB[key]||0),maxExisting)+1;
  DB[key]=next;
  return prefix+'-'+String(next).padStart(4,'0');
}
// ═══ ซ่อม ID สมาชิกที่ซ้ำ — เก็บคนที่มียอดซื้อสูงสุดไว้เลขเดิม, คนที่เหลือได้เลขใหม่ ═══
function fixDuplicateMemberIds(silent){
  var groups={};
  (DB.members||[]).forEach(function(m){if(!m||!m.id)return;(groups[m.id]=groups[m.id]||[]).push(m)});
  var fixed=0,detail=[];
  Object.keys(groups).forEach(function(id){
    var arr=groups[id];
    if(arr.length<2) return;
    // เรียงให้คนยอดซื้อสูงสุด (เจ้าของออเดอร์จริง) อยู่หน้า → เก็บ ID เดิมไว้
    arr.sort(function(a,b){return (Number(b.spend)||0)-(Number(a.spend)||0)});
    for(var i=1;i<arr.length;i++){
      var newId=genId('SKN');
      detail.push(id+'→'+newId+' ('+(arr[i].name||'')+')');
      arr[i].id=newId;
      fixed++;
    }
  });
  if(fixed){
    saveDB();if(typeof pushPriceToCloud==='function'){} // ensure sync via saveDB debounce
    logAction('FIX_DUP_ID','ซ่อม ID ซ้ำ '+fixed+' ราย: '+detail.join(', '));
    if(!silent) toast('🔧 ซ่อม ID สมาชิกซ้ำ '+fixed+' รายการ ✅');
  }else if(!silent){
    toast('✅ ไม่พบ ID สมาชิกซ้ำ');
  }
  return fixed;
}
// ── ปรับรหัสสมาชิกที่ไม่ใช่ SKN- (เช่น MBR- จาก webhook เวอร์ชันเก่า) ให้เป็น SKN- + อัปเดต reference ──
function normalizeMemberIds(silent){
  var renamed=0,detail=[];
  (DB.members||[]).forEach(function(m){
    if(!m||!m.id)return;
    if(String(m.id).indexOf('SKN-')===0)return;
    var oldId=m.id;var newId=genId('SKN');
    (DB.orders||[]).forEach(function(o){if(o.mid===oldId)o.mid=newId});
    (DB.quotas||[]).forEach(function(q){if(q.mid===oldId)q.mid=newId});
    m.id=newId;renamed++;detail.push(oldId+'→'+newId+' ('+(m.name||'')+')');
  });
  if(renamed){
    saveDB();
    logAction('NORMALIZE_ID','แปลงรหัสสมาชิกเป็น SKN '+renamed+' ราย: '+detail.join(', '));
    if(!silent) toast('🔧 ปรับรหัสสมาชิกเป็น SKN '+renamed+' รายการ ✅');
  }
  return renamed;
}

// เช็คว่ายังมีตัวอักษรไทยหลงเหลือไหม (แปลไม่สำเร็จ)
function hasThaiChar(s){return /[฀-๿]/.test(String(s||''))}
// แปลไทย→อังกฤษแบบ best-effort (จับคู่คำยาวสุดก่อน)
function autoTranslateTh(th){
  th=String(th||'').trim();if(!th)return '';
  if(TH_EN_DICT[th])return TH_EN_DICT[th];
  var keys=Object.keys(TH_EN_DICT).sort(function(a,b){return b.length-a.length});
  var out=th;
  keys.forEach(function(k){if(out.indexOf(k)>=0)out=out.split(k).join(' '+TH_EN_DICT[k]+' ')});
  out=out.replace(/\s+/g,' ').trim();
  return out;
}

function applyEnTranslate(srcText,dst){
  var th=String(srcText||'').trim();
  if(!th){toast('กรอกข้อความภาษาไทยก่อน','warn');return}
  var en=autoTranslateTh(th);

    // แปลไม่ได้ หรือแปลได้บางส่วน (ยังมีไทยเหลือ) → ไม่ใส่ไทยลงช่อง EN

    if(dst)dst.focus();

// หา rate ต่อกิโล ตามน้ำหนัก (คิดทั้งก้อนตามช่วงที่น้ำหนักตกอยู่ — ยิ่งเยอะยิ่งถูก)
function wRate(svc,kg){
  var tiers=((svc&&svc.tiers)||[]).slice().sort(function(a,b){var am=(a.max>0?a.max:1e9),bm=(b.max>0?b.max:1e9);return am-bm});
  if(!tiers.length) return 0;
  for(var i=0;i<tiers.length;i++){var mx=(tiers[i].max>0?tiers[i].max:1e9);if(kg<=mx)return parseFloat(tiers[i].rate)||0}
  return parseFloat(tiers[tiers.length-1].rate)||0;
}
// คำนวณ 1 บรรทัด → {kg, billKg, rate, amount, cost, minApplied}
function wLineCalc(svc,kg){
  kg=parseFloat(kg)||0;if(kg<0)kg=0;
  var minKg=parseFloat(svc&&svc.minKg)||0;
  var billKg=kg,minApplied=false;
  if(minKg>0&&kg>0&&kg<minKg){billKg=minKg;minApplied=true}
  var rate=wRate(svc,billKg);
  var amount=Math.round(billKg*rate*100)/100;
  var cost=Math.round(billKg*(parseFloat(svc&&svc.cost)||0)*100)/100;
  return {kg:kg,billKg:billKg,rate:rate,amount:amount,cost:cost,minApplied:minApplied};
}
// สรุปช่วงราคาเป็นข้อความ เช่น "≤10กก. 40฿ · ≤30กก. 35฿ · >30กก. 30฿"

  var tiers=((svc&&svc.tiers)||[]).slice().sort(function(a,b){var am=(a.max>0?a.max:1e9),bm=(b.max>0?b.max:1e9);return am-bm});
  return tiers.map(function(t){return (t.max>0?'≤'+t.max+'กก.':'>'+(tiers.length>1?tiers[tiers.length-2].max:0)+'กก.')+' '+(parseFloat(t.rate)||0)+'฿'}).join(' · ');
}

function fmtJoinDate(d){
  if(!d||d==='-') return '-';
  var s=String(d);
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  try{
    var dt=new Date(s);
    if(isNaN(dt.getTime())){
      var pts=s.split(/[\/\-]/);if(pts.length>=3){
        var y=parseInt(pts[2])||2026;if(y>2500)y-=543;
        return pts[0].padStart(2,'0')+'/'+pts[1].padStart(2,'0')+'/'+y;
      }
      return s;
    }
    var yr=dt.getFullYear();if(yr>2500)yr-=543;
    return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+yr;
  }catch(e){return s}
}

function formatBillDate(dt){
  if(!dt) return formatBillDate(new Date().toISOString());
  try{
    // Already formatted dd/mm/yyyy — parse it
    if(typeof dt==='string'&&dt.match(/^\d{2}\/\d{2}\/\d{4}/)){
      var clean=dt.replace(/\s*น\.?\s*$/,'');// strip น. suffix
      var parts=clean.split(/[\/ :]/);
      var yr=parseInt(parts[2]);
      if(yr>2500) yr=yr-543; // Convert Buddhist to CE
      var timePart=(parts[3]&&parts[4])?parts[3]+':'+parts[4]:'';
      return parts[0]+'/'+parts[1]+'/'+yr+(timePart?' '+timePart+' น.':'');
    }
    // ISO or other format
    var d=new Date(dt);if(isNaN(d)) return dt;
    var dd=String(d.getDate()).padStart(2,'0');
    var mm=String(d.getMonth()+1).padStart(2,'0');
    var yy=d.getFullYear(); // CE year (ค.ศ.)
    var hh=String(d.getHours()).padStart(2,'0');
    var mi=String(d.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+yy+' '+hh+':'+mi+' น.';
  }catch(e){return dt}
}

// ── แสดงเวลานัด (แก้ค่าเพี้ยน 1899-12-30...Z จาก Google Sheets ให้เหลือ HH:MM) ──
function cleanTimeStr(t){
  t=String(t||'').trim();if(!t) return '';
  if(t.indexOf('T')>=0||t.indexOf('Z')>=0){try{var d=new Date(t);if(!isNaN(d.getTime()))return d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){}}
  return /^\d{1,2}:\d{2}/.test(t)?t.slice(0,5):t;
}
function netOf(o){return Math.max(0,(o.net||0))}
function paidTotal(o){return (o.payHist||[]).reduce((s,p)=>s+p.amt,0)}
function isPaidCheck(o){return paidTotal(o)>=netOf(o)}
function remaining(o){return Math.max(0,netOf(o)-paidTotal(o))}
function isEditable(o){
  if(o.type==='cleaning') return EDITABLE_CLN.includes(o.status);
  return EDITABLE_LDR.includes(o.status);
}

  });

}
function selUser(i){
  selUserIdx=i;pinStr='';
  document.querySelectorAll('.user-btn').forEach((b,j)=>b.classList.toggle('sel',j===i));
  $('pinArea').style.display='block';
  $('pinUser').textContent=USERS[i].name+' ('+USERS[i].nick+') — กรุณาใส่ PIN';
  renderPinDots();renderPinPad();$('pinMsg').textContent='';
}
function renderPinDots(){
  let h='';for(let i=0;i<4;i++) h+='<div class="pin-dot'+(i<pinStr.length?' filled':'')+'"></div>';
  $('pinDots').innerHTML=h;
}
function renderPinPad(){
  let h='';
  for(let i=1;i<=9;i++) h+='<button class="pin-key" onclick="padPress(\''+i+'\')">'+i+'</button>';
  h+='<button class="pin-key del" onclick="padPress(\'clear\')">ล้าง</button>';
  h+='<button class="pin-key" onclick="padPress(\'0\')">0</button>';
  h+='<button class="pin-key del" onclick="padPress(\'del\')">⌫</button>';
  $('pinPad').innerHTML=h;
}
function padPress(k){
  if(k==='clear'){pinStr='';renderPinDots();$('pinMsg').textContent='';return}
  if(k==='del'){pinStr=pinStr.slice(0,-1);renderPinDots();return}
  if(pinStr.length>=4) return;
  pinStr+=k;renderPinDots();
  if(pinStr.length===4) checkPin();
}
function checkPin(){
  if(selUserIdx===null) return;
  if(pinStr===USERS[selUserIdx].pin){
    curUser=USERS[selUserIdx];
    logAction('LOGIN','เข้าสู่ระบบ');
    initApp();
  }else{
    $('pinMsg').innerHTML='<span style="color:#FF6B6B">❌ PIN ไม่ถูกต้อง</span>';
    pinStr='';setTimeout(renderPinDots,300);
  }
}

  logAction('LOGOUT','ออกจากระบบ');
  curUser=null;initLockScreen();
}

function initApp(){
  $('lockScreen').style.display='none';$('app').style.display='block';
  $('sfName').textContent=curUser.nick;$('sfRole').textContent=curUser.role;
  buildSidebar();navTo('dashboard');startClock();
  // ═══ Auto-setup: เครื่องใหม่เปิด URL ที่มี ?setup=API_URL → เชื่อมต่ออัตโนมัติ ═══
  var setupUrl=new URLSearchParams(location.search).get('setup');
  if(setupUrl&&!getApiUrl()){
    var s=getShopSettings();s.apiUrl=setupUrl;saveDB();
    toast('🔗 เชื่อมต่อ Cloud อัตโนมัติ...','info');
    // ลบ ?setup= จาก URL เพื่อความปลอดภัย
    history.replaceState(null,'',location.pathname);
  }
  // Initial sync from cloud
  if(getApiUrl()){
    toast('🔄 กำลังดึงข้อมูลจาก Cloud...','info');
    syncPullAll().then(function(){normalizeMemberIds(true);fixDuplicateMemberIds(true);renderPage(curPage);updBadges();toast('✅ เชื่อมต่อสำเร็จ — ข้อมูลพร้อมใช้งาน')}).catch(function(){toast('⚠️ ไม่สามารถเชื่อมต่อ Cloud — ใช้ข้อมูล offline','warn')});
    startAutoPull();
  }
  startDailyReportSchedule();
  // Phase 3: PWA + Notifications
  registerPWA();requestNotifPermission();
  // Flush offline queue
  if(offlineQueue.length) setTimeout(flushOfflineQueue,3000);
}
function buildSidebar(){
  let h='',lastSec='';
  PAGES.filter(function(p){return canAccess(p.id)}).forEach(p=>{
    if(p.section!==lastSec){h+='<div class="sb-section">'+p.section+'</div>';lastSec=p.section}
    h+='<div class="sb-item" data-page="'+p.id+'" onclick="navTo(\''+p.id+'\')"><span class="sb-icon">'+p.icon+'</span>'+p.label+'</div>';
  });
  $('sbNav').innerHTML=h;
}
function navTo(page){
  if(!canAccess(page)){toast('⛔ คุณไม่มีสิทธิ์เข้าถึงหน้านี้','err');return}
  curPage=page;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('act',el.dataset.page===page));
  const pg=PAGES.find(p=>p.id===page);
  $('pageTitle').textContent=pg?pg.icon+' '+pg.label:'';
  renderPage(page);
  if(window.innerWidth<769) toggleSidebar(false);
}
function toggleSidebar(force){
  const sb=$('sidebar'),ov=$('sbOverlay');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);ov.classList.toggle('show',open);
}
async function refreshPage(){
  var btn=$('btnRefresh');

  if(getApiUrl()){
    toast('🔄 กำลังดึงข้อมูลล่าสุด...','info');
    try{
      await syncPullAll();
      renderPage(curPage);updBadges();
      toast('✅ ข้อมูลอัปเดตล่าสุดแล้ว');
    }catch(e){

  if(!lineOA){toast('ไม่พบ LINE OA — กรุณา Copy ข้อความแล้วส่งเอง','warn');prCopyText();return}
  // Use /R/oaMessage/ to open chat WITH pre-filled message
  var oaId=lineOA.replace(/^@/,'');

}
function prCopyMsg(){
  var lineOA=window._regLineOA||'';
  var msg=window._regMsg||'';
  // Copy then open LINE chat with pre-filled message
  try{navigator.clipboard.writeText(msg)}catch(e){}
  if(lineOA){
    var oaId=lineOA.replace(/^@/,'');
    window.open('https://line.me/R/oaMessage/%40'+oaId+'/?'+encodeURIComponent(msg),'_blank');
  }
  toast('📱 เปิด LINE แล้ว — กดส่งข้อความได้เลย ✅');
}
function prCopyText(){
  var msg=window._regMsg||'';
  navigator.clipboard.writeText(msg).then(function(){toast('Copy สำเร็จ ✅')}).catch(function(){toast('กดค้างที่ข้อความแล้ว Copy','info')});
}

function renderDashboardCharts(){
  if(typeof Chart==='undefined') return;
  // ═══ 7-day sales chart ═══
  var labels=[];var salesData=[];var costData=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=fmtDate(d);
    var dayLabel=String(d.getDate())+'/'+String(d.getMonth()+1);
    labels.push(dayLabel);
    var dayOrders=DB.orders.filter(function(o){return o.createdAt&&o.createdAt.startsWith(ds.substring(0,5))});
    salesData.push(dayOrders.reduce(function(s,o){return s+netOf(o)},0));
    var dayExp=(DB.expenses||[]).filter(function(e){return e.date&&e.date.startsWith(ds.substring(0,5))}).reduce(function(s,e){return s+(e.amount||0)},0);
    costData.push(dayExp);
  }
  var ctx1=document.getElementById('chart7days');
  if(ctx1){new Chart(ctx1,{type:'bar',data:{labels:labels,datasets:[{label:'รายได้',data:salesData,backgroundColor:'#3B82C4',borderRadius:4},{label:'ค่าใช้จ่าย',data:costData,backgroundColor:'#F87171',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return '฿'+v}}}}}})}
  // ═══ Service type pie chart ═══
  var typeCount={};
  DB.orders.forEach(function(o){var t=o.type||'laundry';typeCount[t]=(typeCount[t]||0)+1});
  var typeLabels={'laundry':'ซักรีด','bedset':'เครื่องนอน','cleaning':'ทำความสะอาด','weight':'ชั่งกิโล','pkg_buy':'ซื้อ Package','quota':'ใช้โควต้า'};
  var ctx2=document.getElementById('chartPie');
  if(ctx2){new Chart(ctx2,{type:'doughnut',data:{labels:Object.keys(typeCount).map(function(k){return typeLabels[k]||k}),datasets:[{data:Object.values(typeCount),backgroundColor:['#3B82C4','#F59E0B','#10B981','#8B5CF6','#EC4899']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}})}
}

function calcOrderTotal(){
  const itemsTotal=orderItems.reduce((s,it)=>s+it.p*it.qty,0);

  var disc=parseFloat($('co-disc')?$('co-disc').value:0)||0;
  // Apply promo
  var promoIdx=$('co-promo')?$('co-promo').value:'';

    var promos=getActivePromos();var promo=promos[parseInt(promoIdx)];

      promoLabel=promo.name;
      var base=itemsTotal+extrasTotal;
      if(promo.type==='percent') promoDisc=Math.round(base*promo.value/100);
      else if(promo.type==='fixed'||promo.type==='points') promoDisc=promo.value;
    }
  }
  const isDel=$('co-delivery')&&$('co-delivery').value==='delivery';
  const delCost=isDel?parseFloat($('co-del-sel')?$('co-del-sel').value:0)||0:0;
  const net=Math.max(0,itemsTotal+extrasTotal-disc-promoDisc+delCost);
  var display='ยอดสุทธิ: '+thb(net);
  if(promoDisc>0) display+='<div style="font-size:12px;color:var(--am)">🎁 '+promoLabel+' ลด '+thb(promoDisc)+'</div>';
  if($('co-total-box')) $('co-total-box').innerHTML=display;
  // Auto-fill pay amount
  if($('co-payamt')&&!$('co-payamt').dataset.edited) $('co-payamt').value=net;
}

// ═══ SAVE ORDER ═══
function saveOrder(){
  if(!orderItems.length){toast('กรุณาเพิ่มรายการซักอย่างน้อย 1 รายการ','err');return}
  const m=gM(orderMemberId);if(!m){toast('ไม่พบข้อมูลลูกค้า','err');return}
  const isDel=$('co-delivery').value==='delivery';
  var delSel=$('co-del-sel')?$('co-del-sel').value:'0';
  const delCost=isDel?(delSel==='custom'?(parseFloat($('co-del-custom')?$('co-del-custom').value:0)||0):parseFloat(delSel)||0):0;
  var disc=parseFloat($('co-disc').value)||0;
  // Apply promo
  var promoName='';
  const promoIdx=$('co-promo')?$('co-promo').value:'';
  if(promoIdx!==''){
    const promos=getActivePromos();const promo=promos[parseInt(promoIdx)];
    if(promo){
      promoName=promo.name;
      const itemsT=orderItems.reduce((s,it)=>s+it.p*it.qty,0)+orderExtras.reduce((s,e)=>s+e.price,0);
      if(promo.type==='percent') disc+=Math.round(itemsT*promo.value/100);
      else if(promo.type==='fixed'||promo.type==='points') disc+=promo.value;
      if(promo.type==='points'&&promo.ptsNeeded){m.pts=Math.max(0,(m.pts||0)-promo.ptsNeeded)}
    }
  }
  const itemsTotal=orderItems.reduce((s,it)=>s+it.p*it.qty,0);
  const extrasTotal=orderExtras.reduce((s,e)=>s+e.price,0);
  const net=Math.max(0,itemsTotal+extrasTotal-disc+delCost);
  const cost=orderItems.reduce((s,it)=>s+it.k*it.qty,0);
  const paidNow=$('co-paid').value==='1';
  var payAmt=paidNow?(parseFloat($('co-payamt')?$('co-payamt').value:0)||net):0;
  var payDate=paidNow?fmtDate(new Date($('co-paydate')?$('co-paydate').value:new Date())):'';
  var payTime=paidNow?($('co-paytime')?$('co-paytime').value:''):'';
  var payDateStr=payDate+(payTime?' '+payTime:'');
  const payHist=paidNow?[{round:1,method:$('co-method')?$('co-method').value:'เงินสด',amt:payAmt,date:payDateStr,by:curUser.nick}]:[];
  const order={
    id:genId('LDR'),type:'laundry',mid:m.id,mname:m.name,mphone:m.phone,
    status:'รับผ้ารอส่งซัก',delivery:isDel?'delivery':'pickup',
    delCost:delCost,deliveryAddr:isDel?($('co-addr')?$('co-addr').value.trim():''):'',mapLink:isDel?($('co-maplink')?$('co-maplink').value.trim():''):'',
    items:[...orderItems],extras:[...orderExtras],disc:disc,net:net,cost:cost,
    payHist:payHist,isPaid:paidNow&&payAmt>=net,pts:pts4(net),
    promo:promoName,note:$('co-note')?$('co-note').value.trim():'',
    pickupDate:$('co-pickup')?$('co-pickup').value:'',
    createdAt:fmtDT(),by:curUser.nick
  };
  DB.orders.push(order);
  var totalItems=(order.items||[]).reduce(function(s,it){return s+(it.qty||1)},0);deductShopQuota(totalItems,order.type,order.items);
  if(order.isPaid){m.spend=(m.spend||0)+net;m.pts=(m.pts||0)+order.pts}
  saveDB();
  logAction('CREATE_ORDER',order.id+' '+thb(net)+(promoName?' โปร:'+promoName:''));
  toast('สร้างออเดอร์สำเร็จ ✅ '+order.id);
  closeMo('moCreateOrder');navTo('orders');
}

function advanceStatus(oid){
  const o=gO(oid);if(!o) return;

  const idx=statuses.indexOf(o.status);
  if(idx<0||idx>=statuses.length-2) return;
  var nextSt=statuses[idx+1];

    toast('⚠️ ต้องชำระเงินให้ครบก่อนเปลี่ยนเป็น "'+nextSt+'"','err');return;

  // Cleaning: ถ้าชำระแล้วและ next คือ "เสร็จสิ้น รอชำระ" → ข้ามไป "ปิดงาน"

  var m=gM(o.mid);

    sendFlexStatus(m.lineUserId,o,s);
  }
}

// ═══ คืนโควต้าส่วนกลาง (เมื่อยกเลิก/ลบออเดอร์) ═══
function returnShopQuota(itemCount,orderType,items){
  var quotas=getShopQuotas();if(!quotas.length||!itemCount) return;
  var categories=[];
  if(items&&items.length) items.forEach(function(it){if(it.c&&categories.indexOf(it.c)<0) categories.push(it.c)});
  for(var i=0;i<quotas.length;i++){
    var q=quotas[i];if(itemCount<=0) break;
    var match=q.type==='ซักทั่วไป';
    if(!match) categories.forEach(function(cat){if(cat.indexOf(q.type)>=0||q.type.indexOf(cat)>=0) match=true});
    if(!match&&orderType==='bedset'&&q.type==='เครื่องนอน') match=true;
    if(!match&&orderType==='cleaning'&&q.type==='ทำความสะอาด') match=true;
    if(match){var ret=Math.min(itemCount,q.used);q.used-=ret;q.remain+=ret;itemCount-=ret}
  }
}

// เรนเดอร์บาร์โค้ด Code128 ของเลขออเดอร์บนบิล (รอ JsBarcode โหลดถ้ายังไม่มา)
function renderBillBarcodes(root,tries){
  root=root||document;tries=tries||0;
  var els=root.querySelectorAll?root.querySelectorAll('svg.billBarcode'):[];
  if(!els.length) return;
  if(typeof JsBarcode==='undefined'){
    if(tries<20) setTimeout(function(){renderBillBarcodes(root,tries+1)},150);
    return;
  }
  els.forEach(function(svg){
    var val=svg.getAttribute('data-val');if(!val||svg.getAttribute('data-done')==='1') return;
    try{
      JsBarcode(svg,val,{format:'CODE128',width:1.5,height:38,displayValue:false,margin:0,background:'#ffffff',lineColor:'#000000'});
      svg.setAttribute('data-done','1');
    }catch(e){console.error('barcode',e)}
  });
}
function doPrint(oid,paperSize){
  const billEl=$('moBillIn').querySelector('.modal-body');
  if(!billEl) return;
  var pa=$('printArea');pa.innerHTML=billEl.innerHTML;
  var content=billEl.innerHTML;
  // ═══ ตรวจประเภทกระดาษ ═══
  // paperSize อาจถูกส่งมาจากปุ่ม (a4/a5/thermal) หรือ auto-detect
  var size=paperSize||'';
  if(!size){
    if(content.includes('width:210mm')||content.includes('width:190mm')) size='a4';
    else if(content.includes('width:148mm')||content.includes('width:138mm')) size='a5';
    else size='thermal';
  }
  // Inject dynamic @page style
  var oldStyle=document.getElementById('dynPageStyle');if(oldStyle) oldStyle.remove();
  var styleEl=document.createElement('style');styleEl.id='dynPageStyle';
  if(size==='a4'){pa.className='print-a4';styleEl.innerHTML='@media print{@page{size:A4 portrait;margin:12mm}}'}
  else if(size==='a5'){pa.className='print-a5';styleEl.innerHTML='@media print{@page{size:A5 portrait;margin:8mm}}'}
  else{pa.className='';styleEl.innerHTML='@media print{@page{size:80mm 300mm;margin:1mm 2mm}}'}
  document.head.appendChild(styleEl);
  pa.style.display='block';
  // ── ตั้งชื่อไฟล์ PDF ตอน "Save as PDF" = ชื่อเดียวกับตอนบันทึกรูป ──
  var _oldTitle=document.title;
  if(window._billFileName){document.title=safeFileName(window._billFileName)}
  window.print();
  setTimeout(function(){pa.style.display='none';pa.className='';if(styleEl)styleEl.remove();document.title=_oldTitle},800);
}
// ── ทำชื่อไฟล์ให้ปลอดภัย (ตัดอักขระที่ใช้ตั้งชื่อไฟล์ไม่ได้) ──
function safeFileName(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().replace(/ /g,'_')}
function saveBillImage(oid){
  var src=$('moBillIn').querySelector('.modal-body > div');
  if(!src) src=$('moBillIn').querySelector('.modal-body');
  if(!src){toast('ไม่พบบิล','err');return}
  if(typeof html2canvas==='undefined'){toast('กำลังโหลด... ลองกดอีกครั้ง','warn');return}
  toast('📸 กำลังบันทึกรูปบิล...','info');
  var fname=window._billFileName?safeFileName(window._billFileName):('SAKKANID_bill_'+oid+'_'+todayStr().replace(/-/g,''));
  // ── โคลนเอกสารไปวางนอกจอ เพื่อแคปให้ครบ ไม่ตกบรรทัด ไม่ถูกตัด ──
  // ── เลือกความกว้างตามชนิดเอกสาร: ใบเสร็จแนวยาว (80mm) แคบ, A5 กลาง, A4 เต็มหน้า ──
  var wStyle=(src.style&&String(src.style.width))||'';
  var W,scale;
  if(wStyle.indexOf('80mm')>=0){ W=384; scale=3; }        // ใบเสร็จแนวยาว (thermal slip) — คงสัดส่วนแคบสวย
  else if(wStyle.indexOf('148')>=0){ W=560; scale=2; }    // A5
  else{ W=794; scale=2; }                                 // A4 / เอกสารเต็มหน้า
  var wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-11000px;top:0;background:#fff;z-index:-1';
  var clone=src.cloneNode(true);
  clone.style.width=W+'px';clone.style.maxWidth=W+'px';clone.style.margin='0';
  wrap.appendChild(clone);document.body.appendChild(wrap);
  var done=function(){try{document.body.removeChild(wrap)}catch(e){}};
  html2canvas(clone,{scale:scale,backgroundColor:'#ffffff',useCORS:true,width:W,height:clone.offsetHeight,windowWidth:W+40,windowHeight:clone.offsetHeight+40}).then(function(canvas){
    var link=document.createElement('a');
    link.download=fname+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    done();
    toast('📸 บันทึกรูปบิลสำเร็จ ✅');
  }).catch(function(e){done();toast('❌ บันทึกรูปล้มเหลว: '+e.message,'err')});
}

function editItemQty(i,val){

function editRemoveItem(i){

function editDeliveryChange(){
  var isDel=$('eo-delivery')&&$('eo-delivery').value==='delivery';
  if($('eo-del-tier')) $('eo-del-tier').style.display=isDel?'block':'none';
  if($('eo-del-addr')) $('eo-del-addr').style.display=isDel?'block':'none';
  var o=gO(editOid);if(o) $('eo-total-box').innerHTML=calcEditTotalDisplay(o);
}
function eoPromoChange(){
  var o=gO(editOid);if(!o) return;
  var pi=$('eo-promo')?$('eo-promo').value:'';
  if(pi!==''){
    var promos=getActivePromos();var pr=promos[parseInt(pi)];
    if(pr){
      var itemsT=(o.items||[]).reduce(function(s,it){return s+it.p*it.qty},0)+editExtras.reduce(function(s,e){return s+e.price},0);
      var promoDisc=pr.type==='percent'?Math.round(itemsT*pr.value/100):pr.value;
      if($('eo-disc'))$('eo-disc').value=promoDisc;
    }
  }
  $('eo-total-box').innerHTML=calcEditTotalDisplay(o);
}
function eoRecalc(){var o=gO(editOid);if(o)$('eo-total-box').innerHTML=calcEditTotalDisplay(o)}
function calcEditTotalDisplay(o){
  var itemsTotal=(o.items||[]).reduce(function(s,it){return s+it.p*it.qty},0);
  var extrasTotal=editExtras.reduce(function(s,e){return s+e.price},0);
  var disc=parseFloat($('eo-disc')?$('eo-disc').value:o.disc)||0;
  var isDel=$('eo-delivery')?$('eo-delivery').value==='delivery':o.delivery==='delivery';
  var delCost=isDel?parseFloat($('eo-del-sel')?$('eo-del-sel').value:o.delCost)||0:0;
  var net=Math.max(0,itemsTotal+extrasTotal-disc+delCost);
  var paid=paidTotal(o);
  var newRemaining=Math.max(0,net-paid);
  var result='ยอดสุทธิ: '+thb(net);
  if(paid>0&&net>o.net){
    result+='<div style="font-size:12px;color:var(--rd);margin-top:4px">⚠️ ยอดเพิ่มขึ้น '+thb(net-o.net)+' → ต้องเก็บเพิ่ม '+thb(newRemaining)+'</div>';
  }else if(paid>0&&paid>=net){
    result+='<div style="font-size:12px;color:var(--gn);margin-top:4px">✅ ชำระครบแล้ว (จ่ายไป '+thb(paid)+')</div>';
  }
  return result;
}
function saveEditOrder(){
  const o=gO(editOid);if(!o) return;
  o.extras=[...editExtras];
  o.disc=parseFloat($('eo-disc').value)||0;
  // Save promo
  var epi=$('eo-promo')?$('eo-promo').value:'';
  if(epi!==''){var eps=getActivePromos();var epr=eps[parseInt(epi)];if(epr)o.promo=epr.name}else{o.promo=''}
  o.note=$('eo-note')?$('eo-note').value.trim():'';
  o.pickupDate=$('eo-pickup')?$('eo-pickup').value:'';
  if($('eo-delivery')){
    o.delivery=$('eo-delivery').value;
    o.delCost=o.delivery==='delivery'?parseFloat($('eo-del-sel')?$('eo-del-sel').value:0)||0:0;
    o.deliveryAddr=o.delivery==='delivery'?($('eo-addr')?$('eo-addr').value.trim():''):'';
  }
  const itemsTotal=(o.items||[]).reduce(function(s,it){return s+it.p*it.qty},0);
  const extrasTotal=o.extras.reduce(function(s,e){return s+e.price},0);
  o.net=Math.max(0,itemsTotal+extrasTotal-o.disc+(o.delCost||0));
  o.cost=(o.items||[]).reduce(function(s,it){return s+it.k*it.qty},0);
  o.isPaid=isPaidCheck(o);
  saveDB();logAction('EDIT_ORDER',editOid+' ยอดใหม่: '+thb(o.net));
  toast('แก้ไขสำเร็จ ✅ ยอด: '+thb(o.net));closeMo('moEditOrder');renderPage(curPage);
}

function searchOrdersByTag(q){
  q=(q||'').trim().toLowerCase();
  var resEl=$('ordersSearchResult');var defEl=$('ordersDefaultView');
  if(!resEl) return;
  if(q.length<1){ // ว่าง → กลับไปมุมมองปกติ
    resEl.innerHTML='';if(defEl) defEl.style.display='';return;
  }
  if(defEl) defEl.style.display='none';
  var list=DB.orders.filter(function(o){
    return o.id.toLowerCase().includes(q)||(o.mname||'').toLowerCase().includes(q)||String(o.mphone||'').includes(q);
  }).slice().reverse().slice(0,30);
  var head='<div class="card" style="padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div class="card-title" style="margin:0;font-size:13px">🔍 ผลการค้นหา "'+q+'" ('+list.length+')</div><button class="btn btn-out btn-sm" onclick="clearOrderTagSearch()">✕ ล้าง</button></div>';
  if(!list.length){resEl.innerHTML=head+'<div class="empty-state"><div class="es-icon">🔍</div><div class="es-text">ไม่พบออเดอร์ที่ตรงกับ "'+q+'"</div></div>';return}
  resEl.innerHTML=head+list.map(function(o){return orderCardHTML(o)}).join('');
}
function clearOrderTagSearch(){var i=$('orderTagSearch');if(i)i.value='';searchOrdersByTag('')}
function filterOrders(el,st){
  document.querySelectorAll('#ordersDefaultView .filter-chip').forEach(function(c){c.classList.remove('act');var sc=c.getAttribute('data-scol');c.style.background='';c.style.color=sc||'';c.style.borderColor=sc||''});
  el.classList.add('act');
  var mycol=el.getAttribute('data-scol');
  if(mycol){el.style.background=mycol;el.style.color='#fff';el.style.borderColor=mycol}
  const all=DB.orders.filter(o=>!['เสร็จสิ้น','ปิดงาน','ยกเลิก'].includes(o.status));
  const filtered=st==='all'?all:all.filter(o=>o.status===st);
  $('ordersContainer').innerHTML=filtered.length?filtered.reverse().map(o=>orderCardHTML(o)).join(''):'<div class="empty-state"><div class="es-text">ไม่มีออเดอร์ในสถานะนี้</div></div>';

// ═══ ใบคุม VENDER — สรุปส่งผ้าประจำวัน (แยกตามผู้รับซัก) ═══
// ═══════════════════════════════════════════════════════════════
// ═══ ใบคุม Vender (v2) — จ่ายงานเอง · แยกแท็บต่อร้าน · Pcs+Kg แก้ได้ · ประวัติตามวัน ═══
// ═══════════════════════════════════════════════════════════════
var VENDER_LIST=['JUSTPIN','Going Laundry','ร้านที่ 3'];
function getVenderList(){
  var s=getShopSettings();
  if(!Array.isArray(s.vendors)||!s.vendors.length){s.vendors=['JUSTPIN','Going Laundry','ร้านที่ 3']}
  return s.vendors;
}
function syncVenderList(){VENDER_LIST=getVenderList();return VENDER_LIST}
function getVenderAssign(){var s=getShopSettings();if(!s.venderAssign||typeof s.venderAssign!=='object')s.venderAssign={};return s.venderAssign}
function getVenderEdit(){var s=getShopSettings();if(!s.venderEdit||typeof s.venderEdit!=='object')s.venderEdit={};return s.venderEdit}
function venderSelDate(){return window._vdSelDate||todayStr()}
function pushVenderCloud(){if(typeof pushSettingsNow==='function')pushSettingsNow();window._settingsDirtyUntil=Date.now()+60000}
// สีประจำร้าน (ไล่ตามลำดับ) — ใช้ทั้งบนจอ + พิมพ์ กันส่งผิดเจ้า
var VENDER_COLORS=['#0067A5','#C4820A','#1E7F4F','#8B2FC9','#C0392B','#0E7C86','#B54708','#2563EB'];
function venderColorByIndex(vi){return VENDER_COLORS[((vi%VENDER_COLORS.length)+VENDER_COLORS.length)%VENDER_COLORS.length]}
function venderColor(vname){var i=getVenderList().indexOf(vname);return venderColorByIndex(i<0?0:i)}
function venderColorLight(vname){return venderColor(vname)+'22'}
// รายชื่อวันในช่วง (YYYY-MM-DD) แบบรวมปลายทั้งสอง
function dateRangeList(from,to){
  var out=[];try{var a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');if(isNaN(a)||isNaN(b)||a>b)return [];var g=0;while(a<=b&&g<400){out.push(a.toISOString().slice(0,10));a.setDate(a.getDate()+1);g++}}catch(e){}
  return out;
}

// createdAt ("DD/MM/พ.ศ. HH:MM น.") → ISO YYYY-MM-DD (ค.ศ.)
function orderDateISO(o){
  var s=String(o&&o.createdAt||'');
  var m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return '';
  var d=('0'+m[1]).slice(-2),mo=('0'+m[2]).slice(-2),y=parseInt(m[3],10);
  if(y>2400) y-=543;
  return y+'-'+mo+'-'+d;
}
// แถวของ 1 ออเดอร์ (ไม่ routing ตามบริการแล้ว — ทั้งออเดอร์ไปตามที่แอดมินจ่าย)
function venderOrderRows(o){
  var rows=[],isW=(o.type==='weight'),isQ=(o.type==='quota');
  if(o.type==='bedset'){
    var its=o.items||[];
    var setItem=its.find(function(it){return String(it.c||'').indexOf('Set')>=0})||its[0]||{};
    var pieces=its.filter(function(it){return it!==setItem&&String(it.c||'').indexOf('เครื่องนอน')>=0});
    var totalPcs=pieces.reduce(function(s,it){return s+(parseInt(it.qty)||0)},0);
    if(!totalPcs){var mm=String(setItem.o||'').match(/(\d+)/);totalPcs=mm?parseInt(mm[1]):1}
    var pclist=pieces.map(function(p){return p.t+(p.qty>1?' x'+p.qty:'')}).join(', ');
    var detail=(setItem.t?setItem.t:'ชุดเครื่องนอน')+(pclist?' — '+pclist:'');
    rows.push({type:'ชุดเครื่องนอน',t:setItem.t||'',detail:detail,defPcs:totalPcs,defKg:0,defPrice:parseFloat(setItem.p)||0,note:''});
    return rows;
  }
  (o.items||[]).forEach(function(it){
    rows.push({
      type: isQ?(it.t||it.c||''):(it.c||''),
      t: it.t||'',
      detail: isQ?(it.o||it.t||''):((it.t||'')+(it.o?' '+it.o:'')),
      defPcs: isW?0:(parseInt(it.qty||1)||1),
      defKg: isW?(parseFloat(it.billKg||it.kg||0)||0):0,
      defPrice: (parseFloat(it.p)||0)*(parseInt(it.qty)||1),
      note: isQ?'ใช้โควต้า':''
    });
  });
  return rows;
}
// ออเดอร์ทั้งหมดของวันนั้น (เรียงตามเวลารับเข้า)
function ordersForDate(date){
  return (DB.orders||[]).filter(function(o){return orderDateISO(o)===date}).slice().sort(function(a,b){return String(a.createdAt).localeCompare(String(b.createdAt))||String(a.id).localeCompare(String(b.id))});
}
// รวมแถวของร้าน v ในวันนั้น (เฉพาะออเดอร์ที่แอดมินจ่ายให้ร้านนี้)
function venderRowsFor(vname,date){
  var assign=getVenderAssign(),out=[];
  ordersForDate(date).forEach(function(o){
    if((assign[o.id]||'')!==vname)return;
    venderOrderRows(o).forEach(function(r,idx){
      var rr=Object.assign({},r);rr.oid=o.id;rr.key=o.id+'#'+idx;rr.cust=o.mname||'-';rr.vendor=vname;out.push(rr);
    });
  });
  return venderSortByCust(out);
}
// เรียงแถวให้ลูกค้าคนเดียวกันติดกัน (คงลำดับการพบครั้งแรก)
function venderSortByCust(rows){
  var order=[],map={};
  rows.forEach(function(r){var k=r.cust||'-';if(!map[k]){map[k]=[];order.push(k)}map[k].push(r)});
  var out=[];order.forEach(function(k){map[k].forEach(function(r){out.push(r)})});
  return out;
}
function venderGroups(rows){
  var order=[],map={};
  rows.forEach(function(r){var k=r.cust||'-';if(!map[k]){map[k]=[];order.push(k)}map[k].push(r)});
  return order.map(function(k,i){return {cust:k,no:i+1,rows:map[k]}});
}
// ค่าที่ใช้จริง (รวม override ที่แอดมินกรอก) ต่อ 1 แถว
function vEff(r){
  var e=getVenderEdit()[r.key]||{};
  var pcs=(e.pcs!==undefined&&e.pcs!=='')?(parseFloat(e.pcs)||0):(r.defPcs||0);
  var kg=(e.kg!==undefined&&e.kg!=='')?(parseFloat(e.kg)||0):(r.defKg||0);
  var priceManual=(e.price!==undefined&&e.price!=='');
  var price,auto=false;
  if(priceManual)price=parseFloat(e.price)||0;
  else{var units=kg>0?kg:pcs;var ap=venderAutoPrice(r.vendor,{t:r.t,o:'',type:r.type,pcsNum:units||1});if(ap!=null){price=ap;auto=true}else price=''}
  return {pcs:pcs,kg:kg,price:price,auto:auto,ret:(e.ret!==undefined?e.ret:''),note:(e.note!==undefined?e.note:(r.note||''))};
}
function venderTotals(rows){
  var pcs=0,kg=0,price=0;
  rows.forEach(function(r){var e=vEff(r);pcs+=e.pcs;kg+=e.kg;price+=(parseFloat(e.price)||0)});
  return {pcs:pcs,kg:kg,price:price};
}
function venderPcsByType(rows){
  var map={},order=[];
  rows.forEach(function(r){var e=vEff(r);if(!map[r.type]){map[r.type]={pcs:0,kg:0};order.push(r.type)}map[r.type].pcs+=e.pcs;map[r.type].kg+=e.kg});
  return order.map(function(t){return {type:t,pcs:map[t].pcs,kg:map[t].kg}});
}
function venderDateLabelTH(dateISO){var p=String(dateISO||'').split('-');if(p.length!==3)return dateISO;return p[2]+'/'+p[1]+'/'+(parseInt(p[0],10)+543)}

function venderCardNew(vname,vi,date){
  var s=getShopSettings();
  var rows=venderRowsFor(vname,date);
  var vcol=venderColorByIndex(vi);
  var head='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+

    '<span style="font-size:13px;color:var(--t2)">🏷️ ส่งซักร้าน</span>'+
    '<span style="font-size:24px;font-weight:800;color:'+vcol+';letter-spacing:.3px">'+vname+'</span></div>'+
    '<div style="font-size:12px;color:var(--t2)"><span id="vd-cntlbl">'+rows.length+' รายการ</span></div></div>'+

  var thEdit='border:1px solid #999;padding:5px 6px;background:#FFF4D6;font-weight:700;text-align:center;font-size:11px';
  var td='border:1px solid #999;padding:4px 6px;font-size:12px;vertical-align:middle;word-break:break-word';
  var tdMid='border:1px solid #999;padding:3px;font-size:12px;vertical-align:middle';
  var inFill='width:100%;box-sizing:border-box;border:1px solid #E0A800;background:#FFFBEA;border-radius:4px;font-size:12px;height:30px;padding:0 6px';
  var inAuto='width:100%;box-sizing:border-box;border:1px solid #37B37E;background:#E9FBF1;border-radius:4px;font-size:12px;height:30px;padding:0 6px';
  var groups=venderGroups(rows);
  var rowsHtml=groups.map(function(g){
    return g.rows.map(function(r,ri){
      var e=vEff(r);var k=r.key;
      var priceStyle=(e.auto?inAuto:inFill)+';text-align:right';
      var lead=(ri===0)?('<td style="'+td+';text-align:center" rowspan="'+g.rows.length+'">'+g.no+'</td><td style="'+td+'" rowspan="'+g.rows.length+'">'+r.cust+'</td>'):'';
      return '<tr>'+lead+
        '<td style="'+td+'">'+r.type+'</td>'+
        '<td style="'+tdMid+'"><input type="number" value="'+(e.pcs||e.pcs===0?e.pcs:'')+'" placeholder="ชิ้น" data-k="'+attrEsc(k)+'" data-f="pcs" oninput="venderEditInput(this)" onblur="pushVenderCloud()" style="'+inFill+';text-align:center"></td>'+
        '<td style="'+tdMid+'"><input type="number" step="0.1" value="'+(e.kg?e.kg:'')+'" placeholder="กก." data-k="'+attrEsc(k)+'" data-f="kg" oninput="venderEditInput(this)" onblur="pushVenderCloud()" style="'+inFill+';text-align:center"></td>'+
        '<td style="'+td+'">'+r.detail+'</td>'+
        '<td style="'+tdMid+'"><input type="number" value="'+(e.price!==''&&e.price!=null?e.price:'')+'" placeholder="ราคา" title="'+(e.auto?'ราคา '+vname+' อัตโนมัติ (แก้ได้)':'พิมพ์ราคาเอง')+'" data-k="'+attrEsc(k)+'" data-f="price" oninput="venderEditInput(this)" onblur="pushVenderCloud()" style="'+priceStyle+'"></td>'+
        '<td style="'+tdMid+'"><input type="text" value="'+attrEsc(e.ret||'')+'" placeholder="กรอกวันรับ" data-k="'+attrEsc(k)+'" data-f="ret" oninput="venderEditInput(this)" onblur="pushVenderCloud()" style="'+inFill+'"></td>'+
        '<td style="'+tdMid+'"><input type="text" value="'+attrEsc(e.note||'')+'" placeholder="หมายเหตุ" data-k="'+attrEsc(k)+'" data-f="note" oninput="venderEditInput(this)" onblur="pushVenderCloud()" style="'+inFill+'"></td>'+

    }).join('');

  var tot=venderTotals(rows);
  var totTxt=(tot.pcs||0)+' ชิ้น'+(tot.kg?' / '+tot.kg+' กก.':'');

function venderSummaryHtml(rows,tot){
  var byType=venderPcsByType(rows);
  var sTd='border:1px solid #999;padding:3px 8px;font-size:12px';
  var sTh='border:1px solid #999;padding:3px 8px;font-size:11px;background:#e8eef4;font-weight:700;text-align:center';
  var sumRows=byType.map(function(t){return '<tr><td style="'+sTd+'">'+t.type+'</td><td style="'+sTd+';text-align:center">'+(t.pcs||'')+'</td><td style="'+sTd+';text-align:center">'+(t.kg||'')+'</td></tr>'}).join('');
  return '<div style="margin-top:8px;font-size:12px;font-weight:700">📊 สรุปจำนวนแยกประเภท</div>'+
    '<table style="border-collapse:collapse;margin-top:2px"><tr><th style="'+sTh+';min-width:150px">ประเภทบริการ</th><th style="'+sTh+';min-width:80px">จำนวน (ชิ้น)</th><th style="'+sTh+';min-width:80px">น้ำหนัก (กก.)</th></tr>'+sumRows+'<tr style="font-weight:700"><td style="'+sTd+';text-align:right">รวม</td><td style="'+sTd+';text-align:center">'+(tot.pcs||'')+'</td><td style="'+sTd+';text-align:center">'+(tot.kg||'')+'</td></tr></table>';
}
// เก็บค่าที่แอดมินกรอก (memory + local) แล้วอัปเดตยอดรวมสด
function venderEditInput(el){
  if(!canEditPrice())return;
  var k=el.getAttribute('data-k'),f=el.getAttribute('data-f');
  var st=getVenderEdit();if(!st[k])st[k]={};
  st[k][f]=el.value;
  saveDB();
  venderRecalcTab();
}
function venderRecalcTab(){
  if(String(window._vdTab).indexOf('v')!==0)return;
  var vi=parseInt(String(window._vdTab).replace('v',''),10);var vname=VENDER_LIST[vi];if(vname==null)return;
  var rows=venderRowsFor(vname,venderSelDate());var tot=venderTotals(rows);
  var a=$('vd-totpcs');if(a)a.innerHTML=(tot.pcs||0);
  var b=$('vd-totkg');if(b)b.innerHTML=(tot.kg||0);
  var p=$('vd-ptot');if(p)p.innerHTML=thb(tot.price);
  var cl=$('vd-cntlbl');if(cl)cl.innerHTML=rows.length+' รายการ';
  var sm=$('vd-summary');if(sm)sm.innerHTML=venderSummaryHtml(rows,tot);
}

// ═══ ตารางราคาต่อ Vender (เก็บใน shopSettings ซิงค์ Cloud) ═══
function getVenderPrices(){
  var s=getShopSettings();if(!s.venderPrices||typeof s.venderPrices!=='object')s.venderPrices={};
  syncVenderList();VENDER_LIST.forEach(function(v){if(!Array.isArray(s.venderPrices[v]))s.venderPrices[v]=[]});
  return s.venderPrices;
}
function venderAutoPrice(vendor,row){
  var list=getVenderPrices()[vendor]||[];if(!list.length)return null;
  var detail=((row.t||'')+(row.o?' '+row.o:'')).trim().toLowerCase();
  var t=String(row.t||'').trim().toLowerCase();
  var cat=String(row.type||'').trim().toLowerCase();
  var units=row.pcsNum||1;
  var match=null;
  [detail,t,cat].some(function(key){
    if(!key)return false;
    for(var i=0;i<list.length;i++){var n=String(list[i].name||'').trim().toLowerCase();if(n&&n===key){match=list[i];return true}}
    return false;
  });
  if(!match)return null;
  var p=parseFloat(match.price)||0;
  return Math.round(p*units*100)/100;
}

// ═══ จัดการรายชื่อร้าน (เพิ่ม/แก้/ลบ) ═══
function openVenderManage(){
  if(!canEditPrice()){toast('⛔ เฉพาะเจ้าของร้าน/ผู้จัดการ','err');return}
  window._vmEdit=JSON.parse(JSON.stringify(getVenderList()));
  var h='<div class="modal-overlay show" id="moVM"><div class="modal" style="max-width:460px"><div class="modal-head"><h3>🏷️ จัดการร้าน Vender</h3><button class="modal-close" onclick="document.getElementById(\'moVM\').remove()">&times;</button></div>'+
    '<div class="modal-body" style="overflow-y:auto"><div style="font-size:12px;color:var(--t2);margin-bottom:8px">แก้ชื่อร้านได้เลย (งานที่จ่ายไว้จะย้ายตามชื่อใหม่อัตโนมัติ) · ลบร้านที่ไม่ใช้ · เพิ่มร้านใหม่</div>'+
    '<div id="vm-list"></div>'+
    '<button class="btn btn-out btn-sm" onclick="vmAddRow()" style="margin-top:6px">➕ เพิ่มร้าน</button></div>'+
    '<div class="modal-foot"><button class="btn btn-out" onclick="document.getElementById(\'moVM\').remove()">ยกเลิก</button><button class="btn btn-pr" onclick="saveVenderManage()">💾 บันทึก</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  vmRender();
}
function vmRender(){
  var box=$('vm-list');if(!box)return;var list=window._vmEdit||[];
  box.innerHTML=list.map(function(v,i){return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
    '<span style="font-size:12px;color:var(--t3);width:18px">'+(i+1)+'</span>'+
    '<input value="'+attrEsc(v)+'" oninput="vmSet('+i+',this.value)" placeholder="ชื่อร้าน" style="flex:1;font-size:13px;height:32px;min-height:0">'+
    '<button class="btn btn-out btn-sm" style="color:var(--rd)" onclick="vmDel('+i+')">🗑️</button></div>';
  }).join('')||'<div style="font-size:12px;color:var(--t3)">ยังไม่มีร้าน — กดเพิ่มร้าน</div>';
}
function vmSet(i,v){if(window._vmEdit)window._vmEdit[i]=v}
function vmAddRow(){window._vmEdit=window._vmEdit||[];window._vmEdit.push('');vmRender()}
function vmDel(i){window._vmEdit.splice(i,1);vmRender()}
function saveVenderManage(){
  if(!canEditPrice()){toast('⛔ ไม่มีสิทธิ์','err');return}
  var oldList=getVenderList().slice();
  var neu=(window._vmEdit||[]).map(function(x){return String(x||'').trim()}).filter(Boolean);
  // กันชื่อซ้ำ
  var seen={},uniq=[];neu.forEach(function(n){var lk=n.toLowerCase();if(!seen[lk]){seen[lk]=true;uniq.push(n)}});
  if(!uniq.length){toast('ต้องมีอย่างน้อย 1 ร้าน','err');return}
  var s=getShopSettings();
  // remap ตาม index ที่เปลี่ยนชื่อ (ย้าย assignment + ราคา)
  var assign=getVenderAssign();var vp=s.venderPrices||{};
  for(var i=0;i<Math.min(oldList.length,uniq.length);i++){
    var oldN=oldList[i],newN=uniq[i];
    if(oldN&&newN&&oldN!==newN){
      Object.keys(assign).forEach(function(oid){if(assign[oid]===oldN)assign[oid]=newN});
      if(vp[oldN]&&!vp[newN]){vp[newN]=vp[oldN];delete vp[oldN]}
    }
  }
  s.vendors=uniq;s.venderPrices=vp;s.venderAssign=assign;
  syncVenderList();
  saveDB();pushVenderCloud();
  logAction('CHANGE_SETTINGS','รายชื่อร้าน Vender');
  toast('บันทึกรายชื่อร้านแล้ว ✅');
  var mo=$('moVM');if(mo)mo.remove();
  window._vdTab='inbox';renderVenderPage($('mainContent'));
}

    '<div class="modal-foot"><button class="btn btn-out" onclick="document.getElementById(\'moVP\').remove()">ยกเลิก</button><button class="btn btn-pr" onclick="saveVenderPrices()">💾 บันทึก</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);

function vpRenderRows(vi){
  var v=VENDER_LIST[vi];var list=window._vpEdit[v]||[];
  if(!list.length)return '<div style="font-size:12px;color:var(--t3);padding:6px">ยังไม่มีรายการ — กด "เพิ่มรายการ" หรือ "เติมชื่อจากออเดอร์วันนี้"</div>';
  return list.map(function(r,ri){return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
    '<input placeholder="ชื่อผ้า/บริการ/หมวด" value="'+attrEsc(r.name||'')+'" oninput="vpSet('+vi+','+ri+',\'name\',this.value)" style="flex:1;font-size:12px;height:30px;min-height:0">'+
    '<input type="number" placeholder="ราคา" value="'+(r.price!=null&&r.price!==''?r.price:'')+'" oninput="vpSet('+vi+','+ri+',\'price\',this.value)" style="width:90px;text-align:right;font-size:12px;height:30px;min-height:0">'+
    '<span style="font-size:11px;color:var(--t3)">฿</span>'+
    '<button class="btn btn-out btn-sm" style="color:var(--rd)" onclick="vpDelRow('+vi+','+ri+')">🗑️</button></div>';
  }).join('');
}
function vpSet(vi,ri,field,val){var v=VENDER_LIST[vi];if(window._vpEdit[v]&&window._vpEdit[v][ri])window._vpEdit[v][ri][field]=val}
function vpAddRow(vi){var v=VENDER_LIST[vi];window._vpEdit[v]=window._vpEdit[v]||[];window._vpEdit[v].push({name:'',price:''});$('vp-list-'+vi).innerHTML=vpRenderRows(vi)}
function vpDelRow(vi,ri){var v=VENDER_LIST[vi];window._vpEdit[v].splice(ri,1);$('vp-list-'+vi).innerHTML=vpRenderRows(vi)}
function vpFillFromToday(vi){
  var v=VENDER_LIST[vi];var rows=venderRowsFor(v,venderSelDate());
  window._vpEdit[v]=window._vpEdit[v]||[];
  var have={};window._vpEdit[v].forEach(function(r){have[String(r.name||'').trim().toLowerCase()]=true});
  var added=0;
  rows.forEach(function(r){var nm=String(r.t||r.type||'').trim();if(!nm||have[nm.toLowerCase()])return;have[nm.toLowerCase()]=true;window._vpEdit[v].push({name:nm,price:''});added++});
  $('vp-list-'+vi).innerHTML=vpRenderRows(vi);
  toast(added?('เพิ่ม '+added+' ชื่อจากออเดอร์ที่จ่ายให้ร้านนี้ — ใส่ราคาแล้วบันทึก'):'ไม่มีชื่อใหม่ (ยังไม่จ่ายงานให้ร้านนี้ในวันนี้)');
}
function saveVenderPrices(){
  if(!canEditPrice()){toast('⛔ ไม่มีสิทธิ์','err');return}
  var s=getShopSettings();s.venderPrices=s.venderPrices||{};
  VENDER_LIST.forEach(function(v){s.venderPrices[v]=(window._vpEdit[v]||[]).filter(function(r){return String(r.name||'').trim()!==''}).map(function(r){return {name:String(r.name).trim(),price:parseFloat(r.price)||0}})});
  saveDB();pushVenderCloud();
  toast('บันทึกราคา Vender สำเร็จ ✅ (☁️ sync แล้ว)');logAction('CHANGE_SETTINGS','ราคา Vender');
  var mo=$('moVP');if(mo)mo.remove();
  renderVenderBody();
}

// ═══ Export Excel (ทุกร้าน = 1 ชีท) ตามวันที่เลือก ═══
// สร้าง 1 ชีท (ร้าน v ในวัน date) ต่อท้าย wb — คืน true ถ้ามีข้อมูล
function venderAppendSheet(wb,v,date,multi){
  var rows=venderRowsFor(v,date);if(!rows.length)return false;
  var shop=getShopSettings().shopName||'';
  var bd={style:'thin',color:{rgb:'888888'}};var allB={top:bd,bottom:bd,left:bd,right:bd};
  var tot=venderTotals(rows);var byType=venderPcsByType(rows);var groups=venderGroups(rows);
  var aoa=[],merges=[];
  aoa.push(['สรุปข้อมูลประจำวัน — '+shop,'','','','','','','','']);
  aoa.push(['วันส่งผ้าซัก '+venderDateLabelTH(date),'','','','','Vender:',v,'','']);
  aoa.push(['No.','Customer Name','Laundry Type','Pcs.','Kg.','รายการ','Price','Return Date','หมายเหตุ']);
  var dataStart=3,gi=0;
  groups.forEach(function(g){
    var top=dataStart+gi;
    g.rows.forEach(function(r,ri){
      gi++;var e=vEff(r);
      aoa.push([ri===0?g.no:'', ri===0?r.cust:'', r.type, e.pcs||'', e.kg||'', r.detail, (e.price!==''&&e.price!=null?e.price:''), e.ret||'', e.note||'']);
    });
    if(g.rows.length>1){merges.push({s:{r:top,c:0},e:{r:top+g.rows.length-1,c:0}});merges.push({s:{r:top,c:1},e:{r:top+g.rows.length-1,c:1}})}
  });
  var totRowIdx=aoa.length;
  aoa.push(['','','รวม',(tot.pcs||0),(tot.kg||0),'',tot.price||'','','']);
  aoa.push(['']);
  var sumTitleIdx=aoa.length;aoa.push(['สรุปจำนวนแยกประเภท','','','','','','','','']);
  var sumHeadIdx=aoa.length;aoa.push(['ประเภทบริการ','จำนวน (ชิ้น)','น้ำหนัก (กก.)','','','','','','']);
  byType.forEach(function(t){aoa.push([t.type,t.pcs||'',t.kg||'','','','','','',''])});
  var sumTotIdx=aoa.length;aoa.push(['รวม',tot.pcs||'',tot.kg||'','','','','','','']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:6},{wch:22},{wch:16},{wch:8},{wch:8},{wch:30},{wch:10},{wch:14},{wch:16}];
  ws['!merges']=merges.concat([{s:{r:0,c:0},e:{r:0,c:8}}]);
  function setS(r,c,style,val){var ref=XLSX.utils.encode_cell({r:r,c:c});var cell=ws[ref];if(!cell){cell={t:'s',v:(val!=null?val:'')};ws[ref]=cell}cell.s=Object.assign({},cell.s,style)}
  var R,C;
  for(R=2;R<=totRowIdx;R++)for(C=0;C<=8;C++)setS(R,C,{border:allB,alignment:{vertical:'center',wrapText:true}});
  for(C=0;C<=5;C++)setS(2,C,{fill:{fgColor:{rgb:'E8EEF4'}},font:{bold:true},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:allB});
  for(C=6;C<=8;C++)setS(2,C,{fill:{fgColor:{rgb:'FFF4D6'}},font:{bold:true},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:allB});
  for(C=3;C<=4;C++)setS(2,C,{fill:{fgColor:{rgb:'FFF4D6'}},font:{bold:true},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:allB});
  setS(0,0,{font:{bold:true,sz:14},alignment:{horizontal:'center'}});
  setS(1,5,{font:{bold:true}});setS(1,6,{font:{bold:true}});
  for(C=0;C<=8;C++)setS(totRowIdx,C,{font:{bold:true},fill:{fgColor:{rgb:'F4F7FA'}},border:allB,alignment:{vertical:'center'}});
  for(R=sumHeadIdx;R<=sumTotIdx;R++)for(C=0;C<=2;C++)setS(R,C,{border:allB,alignment:{vertical:'center'}});
  for(C=0;C<=2;C++)setS(sumHeadIdx,C,{fill:{fgColor:{rgb:'E8EEF4'}},font:{bold:true},alignment:{horizontal:'center'},border:allB});
  setS(sumTitleIdx,0,{font:{bold:true}});
  for(C=0;C<=2;C++)setS(sumTotIdx,C,{font:{bold:true},border:allB});
  // ชื่อชีท: หลายวันใส่วันที่กำกับ · ตัดอักขระต้องห้าม · กันซ้ำ
  var dd=date.slice(8,10)+'-'+date.slice(5,7);
  var base=(multi?(v+' '+dd):v).replace(/[\\\/\?\*\[\]:]/g,'-').substring(0,31);
  var nm=base,k=1;while(wb.SheetNames.indexOf(nm)>=0){nm=(base.substring(0,28)+'~'+(++k)).substring(0,31)}
  XLSX.utils.book_append_sheet(wb,ws,nm);
  return true;
}
function exportVenderDates(dates,label){

  dates.forEach(function(date){VENDER_LIST.forEach(function(v){if(venderAppendSheet(wb,v,date,multi))made++})});

  var fn='ใบคุมVender_ซักกะนิด_'+label+'.xlsx';

}

function buildCalendar(year,month){
  const first=new Date(year,month,1);const lastDay=new Date(year,month+1,0).getDate();
  const startDay=first.getDay();
  const cleanings=DB.orders.filter(o=>o.type==='cleaning'&&o.pickupDate);
  const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
    '<button class="btn btn-out btn-sm" onclick="calNav(-1)">◀</button>'+
    '<span style="font-weight:700;font-size:16px">'+monthNames[month]+' '+(year+543)+'</span>'+
    '<button class="btn btn-out btn-sm" onclick="calNav(1)">▶</button></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center">';
  ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(d=>{h+='<div style="font-weight:700;font-size:11px;color:var(--t3);padding:6px">'+d+'</div>'});
  for(let i=0;i<startDay;i++) h+='<div></div>';
  for(let d=1;d<=lastDay;d++){
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayClean=cleanings.filter(o=>o.pickupDate===dateStr);
    const isToday=dateStr===todayStr();
    const hasCln=dayClean.length>0;
    h+='<div onclick="showCalDay(\''+dateStr+'\')" style="padding:8px 4px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;border:1.5px solid '+(isToday?'var(--pr)':'transparent')+';'+(hasCln?'background:var(--gnl);':'')+'">'+
      '<div style="font-weight:'+(isToday?'800':'400')+'">'+d+'</div>'+
      (hasCln?'<div style="font-size:9px;color:var(--gn);font-weight:700">'+dayClean.length+' งาน</div>':'')+
      '</div>';
  }
  h+='</div>';
  // Monthly summary
  const monthClean=cleanings.filter(o=>{const d=o.pickupDate;return d&&d.startsWith(year+'-'+String(month+1).padStart(2,'0'))});
  h+='<div style="margin-top:12px;font-size:12px;color:var(--t3)">งานเดือนนี้: <strong>'+monthClean.length+'</strong> · รายได้: <strong>'+thb(monthClean.reduce((s,o)=>s+netOf(o),0))+'</strong></div>';
  return h;
}
function showCalDay(dateStr){
  const cleanings=DB.orders.filter(o=>o.type==='cleaning'&&o.pickupDate===dateStr);
  const el=$('calDetail');
  if(!cleanings.length){
    el.innerHTML='<div class="card-title">📅 '+dateStr+'</div><div class="empty-state"><div class="es-text">ไม่มีงานวันนี้</div></div>'+

      '<div style="margin-top:4px">'+(isPaidCheck(o)?'<span class="badge bg-gn">ชำระแล้ว</span>':'<span class="badge bg-rd">ค้าง '+thb(remaining(o))+'</span>')+'</div></div>'

function saveCRMSettings(){
  var s=getShopSettings();
  s.crm={ptsRate:parseInt($('crm-rate').value)||100,redeemRate:parseInt($('crm-redeem').value)||1,vipThreshold:parseInt($('crm-vip').value)||10000,welcomePts:parseInt($('crm-welcome').value)||50,silverMin:parseInt($('crm-silver').value)||3000,goldMin:parseInt($('crm-gold').value)||6000};
  s.ptsRate=s.crm.ptsRate;s.welcomePts=s.crm.welcomePts;
  saveDB();pushSettingsNow();logAction('CHANGE_SETTINGS','อัปเดต CRM');toast('บันทึกตั้งค่า CRM สำเร็จ ✅ (☁️ sync แล้ว)');
}
function autoUpdateLevels(){
  var s=getShopSettings();var crm=s.crm||{silverMin:3000,goldMin:6000,vipThreshold:10000};
  var updated=0;
  DB.members.forEach(function(m){
    var oldLv=m.level;
    if(m.spend>=crm.vipThreshold) m.level='VIP';
    else if(m.spend>=crm.goldMin) m.level='Gold';
    else if(m.spend>=crm.silverMin) m.level='Silver';
    else m.level='ทั่วไป';
    if(m.level!==oldLv) updated++;
  });
  saveDB();toast('อัปเดตระดับสำเร็จ ✅ เปลี่ยน '+updated+' คน');renderPage('crm');
}

function quoteAddFromCat(){
  var sel=$('q-item');if(!sel||sel.value===''){toast('เลือกรายการก่อน','err');return}
  var items=sel._items||CAT.filter(function(x){return x.c===($('q-cat')?$('q-cat').value:'')});
  var it=items[parseInt(sel.value)];if(!it)return;
  var qty=parseFloat($('q-qty')?$('q-qty').value:1)||1;
  var desc=(it.c?it.c+' ':'')+it.t+(it.o?' · '+it.o:'');
  window._qItems.push({desc:desc,price:Number(it.p)||0,qty:qty});
  renderQuoteItems();
}
function quoteAddFree(){
  var desc=$('q-fdesc')?$('q-fdesc').value.trim():'';
  var price=parseFloat($('q-fprice')?$('q-fprice').value:0)||0;
  var qty=parseFloat($('q-fqty')?$('q-fqty').value:1)||1;
  if(!desc){toast('ใส่รายละเอียดรายการก่อน','err');return}
  window._qItems.push({desc:desc,price:price,qty:qty});
  $('q-fdesc').value='';$('q-fprice').value='';$('q-fqty').value='1';
  renderQuoteItems();
}
function renderQuoteItems(){
  var box=$('q-items');if(!box)return;
  var items=window._qItems||[];
  var html;
  if(!items.length){html='<div style="font-size:12px;color:var(--t3);padding:8px;background:var(--bg);border-radius:6px">ยังไม่มีรายการ — เพิ่มจากด้านบน (เลือกจากตารางราคา หรือพิมพ์เอง)</div>';}
  else{
    html='<table style="width:100%"><tr><th style="text-align:left">รายการ</th><th style="width:80px">ราคา/หน่วย</th><th style="width:64px">จำนวน</th><th style="width:90px;text-align:right">รวม</th><th></th></tr>'+
      items.map(function(it,i){return '<tr><td style="font-size:12px">'+it.desc+'</td>'+
        '<td><input type="number" value="'+it.price+'" onchange="quoteEditItem('+i+',\'price\',this.value)" style="width:76px;font-size:12px"></td>'+
        '<td><input type="number" value="'+it.qty+'" onchange="quoteEditItem('+i+',\'qty\',this.value)" style="width:60px;font-size:12px"></td>'+
        '<td style="text-align:right;font-size:12px">'+thb((Number(it.price)||0)*(Number(it.qty)||0))+'</td>'+
        '<td><button class="btn btn-rd btn-sm" onclick="quoteRemoveItem('+i+')">✕</button></td></tr>';
      }).join('')+'</table>';
  }
  var sub=items.reduce(function(s,it){return s+(Number(it.price)||0)*(Number(it.qty)||0)},0);
  var disc=parseFloat($('q-disc')?$('q-disc').value:0)||0;
  var tot=Math.max(0,sub-disc);
  html+='<div style="display:flex;justify-content:flex-end;gap:16px;margin-top:6px;font-size:13px;align-items:baseline"><span style="color:var(--t3)">รวมย่อย '+thb(sub)+(disc?' · ส่วนลด -'+thb(disc):'')+'</span><strong style="color:var(--pr);font-size:15px">ยอดรวม '+thb(tot)+'</strong></div>';
  box.innerHTML=html;
}
function quoteEditItem(i,f,v){if(window._qItems&&window._qItems[i]){window._qItems[i][f]=parseFloat(v)||0;renderQuoteItems()}}
function quoteRemoveItem(i){if(window._qItems){window._qItems.splice(i,1);renderQuoteItems()}}
function saveQuote(thenPrint){
  if(!window._qItems||!window._qItems.length){toast('⚠️ เพิ่มรายการอย่างน้อย 1 รายการก่อน','err');return}
  var id=window._qEditId||genQuoteId();
  var rec={
    id:id,
    mid:$('q-mem')?$('q-mem').value:'',
    custName:$('q-name')?$('q-name').value.trim():'',
    custPhone:$('q-phone')?$('q-phone').value.trim():'',
    custAddr:$('q-addr')?$('q-addr').value.trim():'',
    taxId:$('q-taxid')?$('q-taxid').value.trim():'',
    branch:$('q-branch')?$('q-branch').value.trim():'',
    items:window._qItems.slice(),
    disc:parseFloat($('q-disc')?$('q-disc').value:0)||0,
    validDays:parseInt($('q-valid')?$('q-valid').value:30)||30,
    creditDays:parseInt($('q-credit')?$('q-credit').value:0)||0,
    showTotal:$('q-showtotal')?$('q-showtotal').value==='1':true,
    showPay:$('q-showpay')?$('q-showpay').value==='1':true,
    note:$('q-note')?$('q-note').value.trim():'',
    by:curUser?(curUser.nick||curUser.name||''):''
  };
  if(!DB.quotes)DB.quotes=[];
  var idx=DB.quotes.findIndex(function(x){return x.id===id});
  if(idx>=0){rec.createdAt=DB.quotes[idx].createdAt;rec.date=DB.quotes[idx].date;DB.quotes[idx]=rec}
  else{rec.createdAt=new Date().toISOString();rec.date=fmtDate();DB.quotes.push(rec)}
  saveDB();logAction('SAVE_QUOTE',id+' '+(rec.custName||'')+' '+thb(quoteTotal(rec)));
  var mo=document.getElementById('moQuote');if(mo)mo.remove();
  toast('💾 บันทึกใบเสนอราคา '+id+' แล้ว ✅');
  if(curPage==='quote')renderPage('quote');
  if(thenPrint)printQuote(id);
}
function deleteQuote(qid){
  if(!confirm('ลบใบเสนอราคา '+qid+' ?'))return;
  DB.quotes=(DB.quotes||[]).filter(function(x){return x.id!==qid});
  saveDB();toast('🗑️ ลบใบเสนอราคาแล้ว');if(curPage==='quote')renderPage('quote');
}

    '<button class="btn btn-pr" onclick="openAddPromo()" style="margin-bottom:12px">➕ เพิ่มโปรโมชั่น</button>'+

function saveNewPromo(){
  const name=$('prm-name')?$('prm-name').value.trim():'';if(!name){toast('กรอกชื่อโปร','err');return}
  if(!DB.promos) DB.promos=[];
  const type=$('prm-type').value;
  const promo={name:name,type:type,value:parseFloat($('prm-val').value)||0,startDate:$('prm-start').value,exp:$('prm-exp').value,active:true};
  if(type==='points'){promo.ptsNeeded=parseInt($('prm-pts')?$('prm-pts').value:0)||0}
  if(type==='buyXfreeY'){promo.buyX=parseInt($('prm-buyx')?$('prm-buyx').value:0)||0;promo.freeY=parseInt($('prm-freey')?$('prm-freey').value:0)||0;promo.applicableSkus=$('prm-skus')?$('prm-skus').value.trim():'';promo.applicableCat=$('prm-svccat')?$('prm-svccat').value:''}
  DB.promos.push(promo);
  saveDB();toast('เพิ่มโปรสำเร็จ ✅');const mo=$('moPromo');if(mo) mo.remove();renderPage('promo');
}
function promoTypeChange(){
  const t=$('prm-type')?$('prm-type').value:'';
  setDisp('prm-pts-area',t==='points'?'block':'none');
  setDisp('prm-bxfy-area',t==='buyXfreeY'?'block':'none');
  if($('prm-val-label')){
    if(t==='percent') $('prm-val-label').textContent='ส่วนลด (%)';
    else if(t==='buyXfreeY') $('prm-val-label').textContent='มูลค่าของแถม (฿)';
    else $('prm-val-label').textContent='ส่วนลด (฿)';
  }
}
function togglePromo(i){if(!DB.promos[i]) return;DB.promos[i].active=!DB.promos[i].active;saveDB();renderPage('promo')}

// ═══ REPORT PAGE ═══
function renderReportPage(c){
  const all=DB.orders.filter(o=>o.status!=='ยกเลิก');
  const paid=all.filter(o=>isPaidCheck(o));
  const totalRevenue=paid.reduce((s,o)=>s+netOf(o),0);
  const totalCost=paid.reduce((s,o)=>s+(o.cost||0),0);
  const profit=totalRevenue-totalCost;
  const unpaid=all.filter(o=>!isPaidCheck(o)&&!['เสร็จสิ้น','ปิดงาน'].includes(o.status));
  const unpaidAmt=unpaid.reduce((s,o)=>s+remaining(o),0);
  c.innerHTML='<div class="grid g4" style="margin-bottom:16px">'+
    '<div class="kpi"><div class="kpi-lbl">รายรับรวม</div><div class="kpi-val">'+thb(totalRevenue)+'</div></div>'+

function rptFinancial(){
  var all=DB.orders.filter(function(o){return o.status!=='ยกเลิก'});
