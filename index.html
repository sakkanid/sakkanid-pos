        return m});
      if(newMem.length!==(DB.members||[]).length||JSON.stringify(newMem.map(function(m){return m.id}))!==JSON.stringify((DB.members||[]).map(function(m){return m.id}))){DB.members=newMem;changed=true}}
    // ── merge ชื่อ LINE / UID / ภาษา จาก Cloud แม้รายชื่อ id ไม่เปลี่ยน (ให้ค่าที่ webhook เขียนไหลเข้ามา ไม่ถูกเขียนทับด้วยค่าว่างตอน push) ──
    if(d.members&&d.members.length){var _mById={};(DB.members||[]).forEach(function(mm){_mById[mm.id]=mm});d.members.forEach(function(sm){var lm=_mById[sm.id];if(!lm)return;['lineName','lineUserId','lang','lineId'].forEach(function(f){if(sm[f]!==undefined&&sm[f]!==''&&sm[f]!==lm[f]){lm[f]=sm[f];changed=true}})})}
    if(d.quotas&&d.quotas.length>0&&d.quotas.length!==(DB.quotas||[]).length){DB.quotas=d.quotas;changed=true}
    if(d.promos&&d.promos.length>0&&d.promos.length!==(DB.promos||[]).length){DB.promos=d.promos;changed=true}
    if(d.expenses&&d.expenses.length>0&&d.expenses.length!==(DB.expenses||[]).length){DB.expenses=d.expenses;changed=true}
    // ═══ PRICELIST — ถ้าเพิ่งแก้ราคาในเครื่อง <60วิ ให้ POS ชนะ ไม่ให้ Cloud ทับ ═══
    var priceLocked=new Date().getTime()<(window._priceDirtyUntil||0);
    // ═══ PRICELIST (CAT) — 3 Guards ป้องกันข้อมูลราคาหาย ═══
    if(!priceLocked&&d.pricelist&&d.pricelist.length>0){
      // Guard 1: ถ้า local มี >50 items แต่ Cloud มี <10 → SKIP (ป้องกัน wipe)
      if(CAT.length>50&&d.pricelist.length<10){
        console.warn('⚠️ syncPull: pricelist Cloud มี '+d.pricelist.length+' items แต่ local มี '+CAT.length+' — SKIP');
      }else{
        // Guard 2: กรอง row ที่มี c + p ครบ (ข้าม row ขยะ/ว่าง)
        var validPL=d.pricelist.filter(function(it){return it.c&&(it.p!==undefined&&it.p!==null&&it.p!=='')});
        if(validPL.length===0){
          console.warn('⚠️ syncPull: pricelist Cloud ไม่มี row ที่มี c+p ครบ — SKIP');
        }else{
          // Guard 3: เช็คว่ามีข้อมูลเปลี่ยนจริง
          var newP=validPL.some(function(it,i){var o=CAT[i];return !o||Number(it.p)!==o.p||it.c!==o.c});
          if(newP){CAT.length=0;validPL.forEach(function(it){CAT.push({c:it.c,ce:it.ce||'',t:it.t,te:it.te||'',o:it.o||'',oe:it.oe||'',p:Number(it.p)||0,k:Number(it.k)||0,pt:it.pt||'fixed',sku:it.sku||'',active:it.active!==false&&it.active!=='FALSE'})});CATS_UNIQUE.length=0;[...new Set(CAT.map(function(x){return x.c}))].forEach(function(c){CATS_UNIQUE.push(c)});changed=true;
            console.log('✅ syncPull: CAT updated — '+CAT.length+' items')}
        }
      }
    }
    // ═══ BED_SETS — Guard เหมือน CAT ═══
    if(!priceLocked&&d.bed_sets&&d.bed_sets.length>0){
      var validBeds=d.bed_sets.filter(function(b){return b.label&&(b.price!==undefined&&b.price!=='')});
      if(validBeds.length>0){
        var bc=validBeds.some(function(b,i){var o=BED_SETS[i];return !o||Number(b.price)!==o.price||(b.labelEn||'')!==(o.labelEn||'')||b.label!==o.label});
        if(bc){BED_SETS.length=0;validBeds.forEach(function(b){var items=b.items;if(typeof items==='string'){try{items=JSON.parse(items)}catch(e){items=[]}}BED_SETS.push({size:b.size,label:b.label,labelEn:b.labelEn||'',price:Number(b.price)||0,cost:Number(b.cost)||0,items:items||[]})});changed=true;
          console.log('✅ syncPull: BED_SETS updated — '+BED_SETS.length+' items')}
      }
    }
    // ═══ CLN_SVCS — Guard เหมือน CAT ═══
    if(!priceLocked&&d.cln_svcs&&d.cln_svcs.length>0){
      var validCln=d.cln_svcs.filter(function(s){return s.type&&(s.minPrice!==undefined&&s.minPrice!=='')});
      if(validCln.length>0){
        var cc=validCln.some(function(s,i){var o=CLN_SVCS[i];return !o||Number(s.minPrice)!==o.minPrice||(s.labelEn||'')!==(o.labelEn||'')||s.label!==o.label});
        if(cc){CLN_SVCS.length=0;validCln.forEach(function(s){CLN_SVCS.push({type:s.type,label:s.label,labelEn:s.labelEn||'',minPrice:Number(s.minPrice)||0,cost:Number(s.cost)||0})});changed=true;
          console.log('✅ syncPull: CLN_SVCS updated — '+CLN_SVCS.length+' items')}
      }
    }
    // ═══ PKGS — Guard เหมือน CAT ═══
    if(!priceLocked&&d.packages&&d.packages.length>0){
      var validPkg=d.packages.filter(function(p){return p.type&&(p.price!==undefined&&p.price!=='')});
      if(validPkg.length>0){
        var pc=validPkg.some(function(p,i){var o=PKGS[i];return !o||Number(p.price)!==o.price||(p.typeEn||'')!==(o.typeEn||'')});
        if(pc){PKGS.length=0;validPkg.forEach(function(p){PKGS.push({type:p.type,typeEn:p.typeEn||'',qty:Number(p.qty)||0,price:Number(p.price)||0,cost:Number(p.cost)||0,expDays:Number(p.expDays)||90})});changed=true;
          console.log('✅ syncPull: PKGS updated — '+PKGS.length+' items')}
      }
    }
    // ═══ Settings — merge ไม่ลบ (แต่ถ้าเพิ่งแก้ในเครื่อง <60วิ ให้ POS ชนะ ไม่ให้ Cloud ทับ) ═══
    if(d.settings&&d.settings.length>0&&new Date().getTime()>(window._settingsDirtyUntil||0)){
      d.settings.forEach(function(s){
        if(s.key&&s.value!==undefined){try{DB.shopSettings[s.key]=JSON.parse(s.value)}catch(e){DB.shopSettings[s.key]=s.value}}
      });
    }
    // ── เติมชื่อ LINE จาก line_users เป็นระยะ (รอบแรก + ทุก ~5 รอบ) เผื่อ members sheet ยังว่าง ──
    window._lnTick=(window._lnTick||0)+1;
    if(window._lnTick===1||window._lnTick%5===0){backfillLineNamesFromCloud()}
    if(changed){
      originalSaveDB();syncStatus='success';lastSyncTime=new Date();updSyncUI();
      toast('🔄 ข้อมูลอัปเดตจาก Cloud','info');
      var rp=['orders','history','members','pricelist','report','dashboard','promo','expense'];
      if(rp.indexOf(curPage)>=0) renderPage(curPage);
    }else{syncStatus='success';lastSyncTime=new Date();updSyncUI()}
  }catch(e){console.error('syncPullSilent error:',e)}
}

// ── Sync UI indicator ──
function updSyncUI(){
  var el=$('syncIndicator');
  if(!el) return;
  var icons={idle:'☁️',syncing:'🔄',success:'✅',error:'⚠️'};
  var labels={idle:'ซิงค์อัตโนมัติ',syncing:'กำลังซิงค์...',success:'ข้อมูลล่าสุด',error:'ซิงค์มีปัญหา'};
  el.innerHTML='<span style="font-size:11px;cursor:pointer" onclick="openSyncPanel()" title="Last sync: '+(lastSyncTime?lastSyncTime.toLocaleTimeString():'never')+'">'+icons[syncStatus]+' '+labels[syncStatus]+'</span>';
}

// ── Sync Panel (manual controls) ──
function openSyncPanel(){
  var h='<div class="modal-overlay show" id="moSync"><div class="modal"><div class="modal-head"><h3>☁️ Google Sheets Sync</h3><button class="modal-close" onclick="document.getElementById(\'moSync\').remove()">&times;</button></div>'+
    '<div class="modal-body">'+
    '<div class="grid g2" style="margin-bottom:12px">'+
    '<div class="kpi"><div class="kpi-lbl">สถานะ</div><div class="kpi-val" style="font-size:16px">'+(syncStatus==='success'?'✅ เชื่อมต่อแล้ว':syncStatus==='syncing'?'🔄 กำลัง sync...':syncStatus==='error'?'❌ ผิดพลาด':'☁️ รอ sync')+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Sync ล่าสุด</div><div class="kpi-val" style="font-size:14px">'+(lastSyncTime?lastSyncTime.toLocaleString('th-TH'):'ยังไม่เคย sync')+'</div></div></div>'+
    '<div style="padding:14px;background:var(--gnl);border-radius:10px;text-align:center;margin-bottom:10px">'+
    '<div style="font-size:15px;font-weight:700;color:var(--gn)">✅ ซิงค์อัตโนมัติทำงานอยู่</div>'+
    '<div style="font-size:12px;color:var(--t2);margin-top:4px">ไม่ต้องกดปุ่มเอง — login เครื่องไหนก็เห็นข้อมูลล่าสุด บันทึกปุ๊บขึ้น Cloud เอง และดึงสดทุกครั้งที่กลับเข้าหน้าจอ</div></div>'+
    '<button class="btn btn-gn" style="width:100%" onclick="syncPullAll().then(function(){document.getElementById(\'moSync\').remove()})">🔄 ดึงข้อมูลล่าสุดตอนนี้</button>'+
    '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:12px;color:var(--t3);padding:4px 0">⚙️ ขั้นสูง (ปกติไม่ต้องใช้)</summary>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">'+
    '<button class="btn btn-out btn-sm" onclick="if(confirm(\'⚠️ เขียนทับข้อมูลบน Cloud ด้วยข้อมูลเครื่องนี้?\')){syncPushAll().then(function(){document.getElementById(\'moSync\').remove()})}"><span style="font-size:16px">📤</span> Push ขึ้น Cloud (เขียนทับ Sheets)</button>'+
    '<button class="btn btn-am btn-sm" onclick="syncTestConnection()">🔌 ทดสอบการเชื่อมต่อ</button>'+
    '<div style="padding:10px;background:var(--bg);border-radius:8px;font-size:11px;color:var(--t3)">'+
    '<strong>Auto-sync:</strong> บันทึกแล้วดันขึ้น Cloud ใน ~2 วินาที · ดึงสดทุก 30 วินาที + ตอน login + ตอนกลับเข้าหน้าจอ<br>'+
    '<strong>URL:</strong> <code style="font-size:10px;word-break:break-all">'+(getApiUrl()||'ยังไม่ได้ตั้งค่า').substring(0,60)+'...</code>'+
    '</div></div></details>'+
    '</div><div class="modal-foot"><button class="btn btn-out" onclick="document.getElementById(\'moSync\').remove()">ปิด</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}

async function syncTestConnection(){
  toast('🔌 กำลังทดสอบ...','info');
  try{
    var r=await jsonpCall('ping','');
    if(r.ok) toast('✅ เชื่อมต่อสำเร็จ! API v'+(r.v||'?'));
    else toast('❌ เชื่อมต่อไม่ได้: '+(r.error||''),'err');
    return r;
  }catch(err){
    toast('❌ เชื่อมต่อไม่ได้: '+err.message,'err');
    return {ok:false,error:err.message};
  }
}

// ═══ BOOTSTRAP ═══
loadDB();initDarkMode();
if(location.search.includes('page=register')||location.search.includes('r=1')){
  document.body.style.overflow='auto';document.body.style.height='auto';
  renderPublicRegister();
}else if(location.search.includes('setup=')){
  var setupApi=new URLSearchParams(location.search).get('setup')||'';
  if(setupApi){
    var s=getShopSettings();s.apiUrl=setupApi;saveDB();
    document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:linear-gradient(135deg,#004E6B,#1ABBEF)"><div style="text-align:center;color:#fff"><div style="font-size:48px;margin-bottom:12px">🔄</div><div style="font-size:20px;font-weight:700">กำลังเชื่อมต่อ Cloud...</div><div style="font-size:13px;opacity:.8;margin-top:8px" id="setupMsg">ดึงข้อมูลจากเครื่องหลัก</div><div id="setupBtns" style="margin-top:20px;display:none"><button onclick="history.replaceState(null,\'\',location.pathname);location.reload()" style="background:#fff;color:#006F98;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px">✅ เข้าใช้งานเลย</button></div></div></div>';
    var setupDone=false;
    var finishSetup=function(msg){
      if(setupDone) return;setupDone=true;
      var mEl=document.getElementById('setupMsg');if(mEl) mEl.textContent=msg||'เชื่อมต่อสำเร็จ!';
      var bEl=document.getElementById('setupBtns');if(bEl) bEl.style.display='block';
      setTimeout(function(){history.replaceState(null,'',location.pathname);location.reload()},1500);
    };
    // Timeout 10 วินาที — ถ้า sync ไม่เสร็จก็เข้าใช้งานได้
    var setupTimeout=setTimeout(function(){finishSetup('⚠️ ใช้เวลานาน — เข้าใช้งานได้เลย')},10000);
    setTimeout(function(){
      syncPullAll().then(function(){
        clearTimeout(setupTimeout);finishSetup('✅ ดึงข้อมูลสำเร็จ!');
      }).catch(function(){
        clearTimeout(setupTimeout);finishSetup('⚠️ ยังเชื่อมต่อไม่ได้ — ลองใหม่ในแอป');
      });
    },1000);
  }
}else{
  initLockScreen();
}
initShortcuts();initErrorHandler();
document.addEventListener('click',resetIdleTimer);
document.addEventListener('keydown',resetIdleTimer);
document.addEventListener('touchstart',resetIdleTimer);
</script>
